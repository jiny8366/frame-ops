"chs": ["sopt", "mat", "fab", "refr"]}, {"key": "p6", "title": "파트6 콘택트렌즈·실기", "chs": ["cl", "prac", "inst"]}, {"key": "p7", "title": "파트7 안과학·양안시·안질환", "chs": ["anat", "phys", "dis", "bv", "eye"]}], "examDate": "2026-12-19", "cards": [{"id": "p1-core1", "part": "p1", "ptitle": "파트1 전체 구조", "f": "시험은 3교시 ?", "b": "시험은 3교시: 1교시 시광학이론 85, 2교시 의료관계법규 20 + 시광학응용 85, 3교시 실기 60 (모두 5지선다)."}, {"id": "p1-core2", "part": "p1", "ptitle": "파트1 전체 구조", "f": "필기 합격 ?", "b": "필기 합격: 전체 60% 이상 그리고 과목마다 40% 이상. 실기 합격: 60% 이상. 둘 다 따로 넘어야 해요."}, {"id": "p1-core3", "part": "p1", "ptitle": "파트1 전체 구조", "f": "전체 구조 핵심 3 ?", "b": "법규 20문항은 8문항(40%) 미만이면 다른 과목이 좋아도 불합격 → 가장 먼저 챙겨요."}, {"id": "p1-core4", "part": "p1", "ptitle": "파트1 전체 구조", "f": "전체 구조 핵심 4 ?", "b": "계산 3종(버전스·정점간거리·프렌티스)은 이론·응용·실기 모두에 나와요."}, {"id": "p1-core5", "part": "p1", "ptitle": "파트1 전체 구조", "f": "전체 구조 핵심 5 ?", "b": "날마다 ★★★ 먼저, 틀린 문제는 1·3·7일 뒤에 다시."}, {"id": "p1-exam-must", "part": "p1", "ptitle": "파트1 전체 구조", "f": "시험 정보와 합격 기준 — 필수 암기", "b": "필기: 총점 60% 이상 + 과목별 40% 이상 · 실기: 60% 이상. 필기·실기 모두 합격해야 최종 합격."}, {"id": "p1-howto-must", "part": "p1", "ptitle": "파트1 전체 구조", "f": "이 자료 쓰는 법 (상자 종류·단계) — 필수 암기", "b": "시험 직전에 다시 볼 숫자·규칙 (주황)."}, {"id": "p2-core1", "part": "p2", "ptitle": "파트2 의료기사법", "f": "안경사 업무 ?", "b": "안경사 업무: 안경 조제·판매, CL 판매, 약제 없는 굴절검사(타각적은 자동굴절검사기기만). 6세 이하는 의사 처방."}, {"id": "p2-core2", "part": "p2", "ptitle": "파트2 의료기사법", "f": "3년 이하 징역 또는 3천만 원 이하 벌금 ?", "b": "3년 이하 징역 또는 3천만 원 이하 벌금: 무면허 업무, 면허 대여·대여받기·알선, 비밀 누설(고소 있어야), 무면허자 안경업소 개설."}, {"id": "p2-core3", "part": "p2", "ptitle": "파트2 의료기사법", "f": "500만 원 이하 벌금 ?", "b": "500만 원 이하 벌금: 명칭 사용, 2개 이상 개설, 미등록 개설, 온라인·통신판매, 업소 밖 판매, 영리 알선."}, {"id": "p2-core4", "part": "p2", "ptitle": "파트2 의료기사법", "f": "과태료는 형벌이 아니에요 ?", "b": "과태료는 형벌이 아니에요: 100만 원 이하(실태 허위 신고, 폐업·변경 미신고, 보고·검사 거부), 500만 원 이하(보수교육 위탁기관 시정명령 불이행)."}, {"id": "p2-core5", "part": "p2", "ptitle": "파트2 의료기사법", "f": "행정처분 ?", "b": "행정처분: 6개월 이내 자격정지(품위손상 등), 등록취소 후 6개월 재개설 금지, 청문은 면허취소·등록취소."}, {"id": "p2-scope-must", "part": "p2", "ptitle": "파트2 의료기사법", "f": "안경사 업무 범위와 면허 — 필수 암기", "b": "6세 이하 아동 안경·CL → 의사 처방 · 약제(조절마비제 등) 쓰는 굴절검사 → 안 됨 · 타각적 검사는 자동굴절검사기기만 (시행령 제2조 [별표 1])"}, {"id": "law-sum1", "part": "p2", "ptitle": "의료관계법규", "f": "의료관계법규: 출제범위", "b": "「의료법」·「의료기사 등에 관한 법률」과 그 시행령·시행규칙 (국시원 출제범위). 아래 조문은 2026년 11월 현재 국가법령정보센터 현행 원문 기준 — 시험 직전 개정 여부를 반드시 확인."}, {"id": "law-sum2", "part": "p2", "ptitle": "의료관계법규", "f": "의료관계법규: 의료기사법 총칙", "b": "제1조 목적: 의료기사, 보건의료정보관리사 및 안경사의 자격·면허 등에 관한 사항 → 국민의 보건 및 의료 향상. 제1조의2 정의: &#x27;안경사&#x27;란 안경(시력보정용에 한정)의 조제 및 판매와 콘택트렌즈(시력보정용이 아닌 경우 포함)의 판매, 안경·콘택트렌즈의 도수를 조정하기 위한 약제를 사용하지 아니하는 굴절검사의 시행을 주된 업무로 하는 사람. 제2조 의료기사 종류(6종): 임상병리사·방사선사·물리치료사·작업치료사·치과기공사·치과위생사 (안경사는 &#x27;의료기사등&#x27;에 포함되나 &#x27;의료기사&#x27;의 종류에는 없음)."}, {"id": "law-sum3", "part": "p2", "ptitle": "의료관계법규", "f": "의료관계법규: 업무범위(시행령 별표 1)", "b": "안경의 조제·판매 및 CL 판매 — 6세 이하 아동용은 의사의 처방에 따라. 약제를 사용하지 않는 자각적 굴절검사, 약제를 사용하지 않는 타각적 굴절검사 중 자동굴절검사기기를 이용한 검사. 시행령 제13조: 의사 지도 없이 업무하는 행위를 품위손상으로 보는 규정에서 안경사·보건의료정보관리사는 제외."}, {"id": "law-sum4", "part": "p2", "ptitle": "의료관계법규", "f": "의료관계법규: 면허·시험", "b": "제4조 국가시험 합격 후 보건복지부장관 면허(6개월 이내 졸업예정자 응시 가능). 제5조 결격사유: 정신질환자(전문의가 적합 인정 시 예외), 마약류 중독자, 피성년후견인·피한정후견인, 이 법·의료법 등 위반 금고 이상 실형 미종료. 제6조 해마다 1회 이상 보건복지부장관 실시, 국시원에 관리 위탁 가능. 제7조 부정행위 → 시험정지·합격무효, 다음 시험 3회 범위 응시제한."}, {"id": "law-sum5", "part": "p2", "ptitle": "의료관계법규", "f": "의료관계법규: 의무", "b": "제9조 무면허 업무·명칭 사용 금지, 면허 대여·대여받기·알선 금지. 제10조 비밀누설 금지. 제11조 최초 면허 후 3년마다 실태·취업상황 신고. 제20조 보수교육(시행령 제11조: 매년 8시간 이상, 대면 또는 온라인)."}, {"id": "law-sum6", "part": "p2", "ptitle": "의료관계법규", "f": "의료관계법규: 안경업소", "b": "제12조 ① 안경사가 아니면 안경 조제·안경업소 개설 불가 ② 1개만 개설 ③ 특별자치시장·특별자치도지사·시장·군수·구청장에게 개설등록 ⑤ 전자상거래·통신판매, 구매·배송 대행 등의 방법으로 판매 금지(누구든지) ⑥ 안경업소에서만 판매 ⑦ CL 판매 시 사용방법·유통기한·부작용 정보 제공. 제13조 폐업·변경 시 지체 없이 신고. 제14조 거짓·과장광고 금지, 영리 목적 고객 알선·유인 금지."}, {"id": "law-sum7", "part": "p2", "ptitle": "의료관계법규", "f": "의료관계법규: 행정처분", "b": "제21조 면허취소(결격사유 해당 시 필수 취소, 면허 대여, 정지기간 중 업무 또는 3회 이상 정지) — 재발급 제한 1년(대여·정지 관련·형사 사유). 제22조 6개월 이내 면허자격정지(품위손상, 개설 불가자에게 고용 등), 미신고 시 신고 때까지 효력정지, 사유 발생 5년 경과 시 처분 불가. 제24조 6개월 이내 영업정지 또는 개설등록 취소(2개 이상 개설, 과장광고, 무면허자에게 업무, 시정명령 불이행 등), 등록취소 후 6개월 내 재개설 금지. 제26조 청문: 면허취소, 개설등록 취소."}, {"id": "law-sum8", "part": "p2", "ptitle": "의료관계법규", "f": "의료관계법규: 벌칙", "b": "제30조 3년 이하 징역 또는 3천만원 이하 벌금: 무면허 업무, 면허 대여·대여받기·알선, 비밀누설(고소가 있어야 공소 — 친고죄), 무면허자 안경업소 개설. 제31조 500만원 이하 벌금: 명칭 사용, 2개 이상 개설, 미등록 개설, 제12조⑤(전자상거래 등) 위반, 업소 외 판매, 영리 알선. 제33조 과태료: 100만원 이하(실태 허위 신고, 폐업·변경 미신고, 보고·검사 거부 등)."}, {"id": "law-sum9", "part": "p2", "ptitle": "의료관계법규", "f": "의료관계법규: 의료법 핵심", "b": "제2조 의료인: 의사·치과의사·한의사·조산사·간호사(5종). 제3조 의료기관: 의원급·조산원·병원급. 제19조 정보 누설 금지. 제25조 3년마다 실태 신고. 제27조 무면허 의료행위 금지. 제33조 의료인은 둘 이상 의료기관 개설·운영 불가. 제56조 치료경험담·거짓·비교·비방 광고 등 금지. 제66조 1년 범위 자격정지. 제87조 개설 자격 위반 10년 이하 징역 또는 1억원 이하 벌금."}, {"id": "p3-core1", "part": "p3", "ptitle": "파트3 기하광학", "f": "단위 ?", "b": "단위: D = 1/m. 25 cm = 4 D, 33 cm ≈ 3 D, 40 cm = 2.5 D, 50 cm = 2 D."}, {"id": "p3-core2", "part": "p3", "ptitle": "파트3 기하광학", "f": "얇은 렌즈 ?", "b": "얇은 렌즈: L′ = L + F (물체가 앞에 있으면 L은 −). 배율 m = L/L′ (음수면 도립)."}, {"id": "p3-core3", "part": "p3", "ptitle": "파트3 기하광학", "f": "두 렌즈 ?", "b": "두 렌즈: F = F₁ + F₂ − dF₁F₂ (d는 m). 간격이 작으면 F₁ + F₂로 어림."}, {"id": "p3-core4", "part": "p3", "ptitle": "파트3 기하광학", "f": "프리즘 ?", "b": "프리즘: 광선은 기저 쪽으로 꺾이고, 상은 꼭지점 쪽으로 보여요. 1Δ = 1 m 앞에서 1 cm."}, {"id": "p3-core5", "part": "p3", "ptitle": "파트3 기하광학", "f": "기하광학 핵심 5 ?", "b": "볼록렌즈는 실패형(핀쿠션) 왜곡, 오목렌즈는 술통형 왜곡."}, {"id": "p3-vergence-must", "part": "p3", "ptitle": "파트3 기하광학", "f": "버전스와 단위 바꾸기 — 필수 암기", "b": "cm → D: 100 ÷ cm · mm → m: ÷ 1000 · 물체가 렌즈 앞 x cm면 L = −100/x"}, {"id": "geo-sum1", "part": "p3", "ptitle": "기하광학", "f": "기하광학: 굴절률·스넬 법칙", "b": "n = c/v. n₁ sin θ₁ = n₂ sin θ₂. 임계각 sin θ_c = n₂/n₁ (밀 → 소 매질). n = 1.5 → θ_c ≈ 41.8°. 응용: 광섬유, 전반사 프리즘."}, {"id": "geo-sum2", "part": "p3", "ptitle": "기하광학", "f": "기하광학: 버전스 공식", "b": "V = U + F (U = n/u, V = n′/v, 거리는 렌즈 기준 부호: 빛 진행 방향 +). 횡배율 m = U/V (공기 중 = v/u). 실물체는 U &lt; 0. 결과 V &gt; 0 → 실상, V &lt; 0 → 허상."}, {"id": "geo-sum3", "part": "p3", "ptitle": "기하광학", "f": "기하광학: 구면 굴절·거울", "b": "구면 굴절력 F = (n₂ − n₁)/r. 구면거울 f = r/2, 1/u + 1/v = 1/f(실제 거리 부호 규약에 주의), 평면거울 2개 사이각 θ → 상의 수 = 360/θ − 1."}, {"id": "geo-sum4", "part": "p3", "ptitle": "기하광학", "f": "기하광학: 렌즈 합성", "b": "밀착: F = F₁ + F₂. 분리: F_e = F₁ + F₂ − (d/n)F₁F₂. 두꺼운 렌즈 후면정점굴절력 F_v′ = F₁/(1 − (t/n)F₁) + F₂."}, {"id": "geo-sum5", "part": "p3", "ptitle": "기하광학", "f": "기하광학: 프리즘", "b": "얇은 프리즘 편향각 δ = (n − 1)A. 프리즘 디옵터 P = 100 tan δ (45° = 100 Δ). 분산: 단파장(보라)일수록 굴절률이 커서 많이 꺾인다."}, {"id": "geo-sum6", "part": "p3", "ptitle": "기하광학", "f": "기하광학: 조리개·수차", "b": "개구조리개 → 입사동(물체 공간 상)·사출동. 시야조리개 → 시야 제한. 단색수차(자이델 5수차): 구면수차·코마·비점수차·상면만곡·왜곡. 색수차: 종색수차 = F/ν, 횡색수차 = P/ν."}, {"id": "p4-core1", "part": "p4", "ptitle": "파트4 물리광학", "f": "물리광학 핵심 1 ?", "b": "굴절률 n = c/v. 매질 속 파장 = λ/n, 진동수는 그대로."}, {"id": "p4-core2", "part": "p4", "ptitle": "파트4 물리광학", "f": "반사 방지 코팅 ?", "b": "반사 방지 코팅: 두께 λ/(4n막), 이상적 굴절률 n막 = √n렌즈 → 두 반사광이 상쇄."}, {"id": "p4-core3", "part": "p4", "ptitle": "파트4 물리광학", "f": "편광 ?", "b": "편광: 물·도로 반사광은 수평 편광 → 편광렌즈 투과축은 수직. I = I₀ cos²θ."}, {"id": "p4-core4", "part": "p4", "ptitle": "파트4 물리광학", "f": "회절 ?", "b": "회절: 구멍이 작을수록, 파장이 길수록 크게 퍼져요. 해상 한계 각 ≈ 1.22λ/D."}, {"id": "p4-core5", "part": "p4", "ptitle": "파트4 물리광학", "f": "물리광학 핵심 5 ?", "b": "산란(레일리) ∝ 1/λ⁴ → 하늘이 파란 이유."}, {"id": "p4-interference-must", "part": "p4", "ptitle": "파트4 물리광학", "f": "간섭과 반사 방지 코팅 — 필수 암기", "b": "막 두께 = λ/(4n막) · 이상적 n막 = √n렌즈 · 반사 두 줄기의 경로차 = λ/2 → 상쇄"}, {"id": "phy-sum1", "part": "p4", "ptitle": "물리광학", "f": "물리광학: 파동", "b": "c = fλ (진공 c = 3.0 × 10⁸ m/s). 매질 속 파장 λ_n = λ/n, 진동수 불변. 광자 에너지 E = hf = hc/λ → 단파장일수록 에너지 큼(자외선 위해성)."}, {"id": "phy-sum2", "part": "p4", "ptitle": "물리광학", "f": "물리광학: 간섭", "b": "보강: 경로차 = mλ, 상쇄: (m + ½)λ. 영의 이중슬릿 무늬 간격 Δy = λL/d. 박막: 반사 시 소→밀 경계에서 반파장 위상 변화. 반사방지막: 광학두께 nt = λ/4, 이상적 n_f = √n_s. 뉴턴 링: 반사광 중심은 어두움."}, {"id": "phy-sum3", "part": "p4", "ptitle": "물리광학", "f": "물리광학: 회절", "b": "단일슬릿 어두운 무늬 a sin θ = mλ. 원형 개구(에어리 원반) 첫 어두운 고리 θ = 1.22 λ/D → 레일리 분해능 한계. 동공이 작으면 회절 증가, 크면 수차 증가."}, {"id": "phy-sum4", "part": "p4", "ptitle": "물리광학", "f": "물리광학: 편광", "b": "말루스 법칙 I = I₀ cos²θ. 비편광 → 이상적 편광자 통과 시 I₀/2. 브루스터각 tan θ_B = n (반사광 완전 편광, 반사광 ⊥ 굴절광). 복굴절(방해석): 상광선·이상광선."}, {"id": "phy-sum5", "part": "p4", "ptitle": "물리광학", "f": "물리광학: 산란·레이저", "b": "레일리 산란 ∝ 1/λ⁴ → 하늘이 파랗다. 레이저: 단색성·가간섭성·지향성·고휘도."}, {"id": "p5-core1", "part": "p5", "ptitle": "파트5 안경·프리즘", "f": "프렌티스 ?", "b": "프렌티스: Δ = c(cm) × F(D). 볼록렌즈는 기저가 광학중심 쪽, 오목렌즈는 반대쪽."}, {"id": "p5-core2", "part": "p5", "ptitle": "파트5 안경·프리즘", "f": "정점간거리 ?", "b": "정점간거리: Fc = F/(1 − dF). 근시는 CL이 약해지고 원시는 강해져요. ±4 D 이상이면 꼭 계산."}, {"id": "p5-core3", "part": "p5", "ptitle": "파트5 안경·프리즘", "f": "구면등가 = S + C/2. 원주 표기 바꾸기 ?", "b": "구면등가 = S + C/2. 원주 표기 바꾸기: S′ = S + C, C′ = −C, 축 ± 90°."}, {"id": "p5-core4", "part": "p5", "ptitle": "파트5 안경·프리즘", "f": "방사선시표 ?", "b": "방사선시표: 선명한 선의 작은 시 숫자 × 30° = (−)원주 축."}, {"id": "p5-core5", "part": "p5", "ptitle": "파트5 안경·프리즘", "f": "프리즘 조제 ?", "b": "프리즘 조제: c = Δ / F(그 방향 경선 도수). (−)렌즈 BI → 광학중심을 바깥으로, BO → 안으로."}, {"id": "p5-prentice-must", "part": "p5", "ptitle": "파트5 안경·프리즘", "f": "프렌티스 법칙: 닮은 삼각형으로 이해하기 — 필수 암기", "b": "Δ = c(cm) × F · 볼록(+)렌즈: 기저 = 광학중심 쪽 · 오목(−)렌즈: 기저 = 광학중심 반대쪽"}, {"id": "p5-add-must", "part": "p5", "ptitle": "파트5 안경·프리즘", "f": "가입도·누진·이중초점 — 필수 암기", "b": "예) 50세 평균 조절력 18.5 − 15 = 3.5 D → 40 cm(2.5 D) 작업, 절반(1.75 D) 남기면 Add = 2.50 − 1.75 = +0.75 D"}, {"id": "sopt-sum1", "part": "p5", "ptitle": "안경광학", "f": "안경광학: 정점간거리 보정", "b": "새 위치의 굴절력 F_c = F / (1 − dF)   (d: 렌즈를 눈 쪽으로 옮긴 거리[m], 안경 → CL이면 d = 정점간거리). 예: −8.00 D @12 mm → −8/(1+0.096) = −7.30 D, +10.00 D @13 mm → +11.49 D. ±4.00 D 미만은 보정 차이 미미."}, {"id": "sopt-sum2", "part": "p5", "ptitle": "안경광학", "f": "안경광학: 원점 굴절과 교정", "b": "원점 거리 r(눈 기준) → 안경 굴절력 F = 1/(r − d) (부호 포함, m). 원점 25 cm 근시, 정점간거리 12 mm → F = −1/0.238 = −4.20 D."}, {"id": "sopt-sum3", "part": "p5", "ptitle": "안경광학", "f": "안경광학: 프렌티스 법칙", "b": "P(Δ) = c(cm) × F(D). 플러스 렌즈: 기저는 광학중심 쪽 / 마이너스 렌즈: 기저는 광학중심 반대쪽. 1 Δ = 1 m에서 1 cm 편위."}, {"id": "sopt-sum4", "part": "p5", "ptitle": "안경광학", "f": "안경광학: 생략안", "b": "굴절력 +60 D, n′ = 4/3, 전초점거리 1/60 = 16.67 mm, 후초점거리 n′/F = 22.2 mm. 축성 비정시를 전초점(각막 앞 약 15.7 mm, 굴스트란드 기준)에서 교정하면 상대배율 = 1 (냅의 법칙)."}, {"id": "sopt-sum5", "part": "p5", "ptitle": "안경광학", "f": "안경광학: 안경배율", "b": "SM = 도수인자 × 형태인자 = [1/(1 − hF)] × [1/(1 − (t/n)F₁)]  (h: 렌즈 후면 ~ 입사동 거리). 플러스 → 확대, 마이너스 → 축소. 부등시 → 부등상시."}, {"id": "sopt-sum6", "part": "p5", "ptitle": "안경광학", "f": "안경광학: 근용안경", "b": "가입도 Add = 1/작업거리 − (사용 가능 조절력, 흔히 조절력의 1/2). 명시역: 원점 = 1/Add(원용 정시 가정), 근점 = 1/(Add + A)."}, {"id": "sopt-sum7", "part": "p5", "ptitle": "안경광학", "f": "안경광학: 시야·저시력", "b": "플러스 고도 렌즈 → 환상암점(ring scotoma), 마이너스 → 환상복시. 확대경 배율 M = F/4 (명시거리 25 cm). 갈릴레이 망원경 M = −F_e/F_o, 경통 길이 = f_o + f_e."}, {"id": "sopt-sum8", "part": "p5", "ptitle": "안경광학", "f": "안경광학: 비점수차·카파각", "b": "사입사 비점수차: 광축 밖 경사 광선 → 최적형(베스트폼) 렌즈 설계로 감소. 카파각: 동공중심선과 시축 사이 각 — 양(+)이면 각막반사가 비측으로 → 가성외사시."}, {"id": "mat-sum1", "part": "p5", "ptitle": "안경재료학", "f": "안경재료학: 안경테", "b": "구성: 프런트(림·브리지·엔드피스), 코받침(패드·패드암), 경첩, 안경다리(템플·팁). 금속: 티타늄(가볍고 내식성·생체적합성 우수, 비자성, 용접 어려움), 니켈-티타늄 형상기억합금(탄성·복원), 모넬(니켈-구리, 니켈 알레르기 주의), 양은(구리-아연-니켈). 플라스틱: 셀룰로오스 아세테이트(가열 성형), 폴리아미드·TR-90 계열(가볍고 유연), 셀룰로이드(가연성)."}, {"id": "mat-sum2", "part": "p5", "ptitle": "안경재료학", "f": "안경재료학: 렌즈 재료 지표", "b": "굴절률 n(높을수록 얇음), 아베수 ν = (n_d − 1)/(n_F − n_C)(낮을수록 색수차 큼), 비중, 내충격성, 반사율 R = ((n − 1)/(n + 1))² (한 면, 수직입사)."}, {"id": "mat-sum3", "part": "p5", "ptitle": "안경재료학", "f": "안경재료학: 대표 재료(대략값)", "b": "크라운유리 n 1.523 / ν 약 59 · CR-39 n 약 1.50 / ν 약 58 / 비중 약 1.32 · 폴리카보네이트 n 약 1.59 / ν 약 30 (내충격성 최우수) · 고굴절 플라스틱 1.60~1.74 (ν 약 32~42)."}, {"id": "mat-sum4", "part": "p5", "ptitle": "안경재료학", "f": "안경재료학: 다초점·누진", "b": "이중초점: 일자형(D형)·원형·E형(이그제큐티브). 상의 도약 = 분절 광학중심과 분절 상단 사이 거리 × 가입도(Prentice). E형·일자형은 분절 광학중심이 상단 근처여서 상 도약이 거의 없음. 누진렌즈: 원용부–누진대–근용부, 측방 비점수차 영역. 하드 디자인(명시역 넓음·수차 집중) vs 소프트 디자인(누진대 길고 수차 분산, 적응 쉬움)."}, {"id": "mat-sum5", "part": "p5", "ptitle": "안경재료학", "f": "안경재료학: 기능성 렌즈", "b": "조광: 유리-할로겐화은, 플라스틱-유기 광변색 염료(자외선 반응, 저온에서 더 진해짐, 차 안에서는 반응 약함). 편광: 수평면 반사광(수평 편광 성분) 차단 — 투과축 수직. 자외선: UV-C 100~280, UV-B 280~315, UV-A 315~400 nm."}, {"id": "mat-sum6", "part": "p5", "ptitle": "안경재료학", "f": "안경재료학: 코팅", "b": "반사방지(AR): 박막 간섭, 막두께 λ/(4n_f), 이상적 단층 굴절률 n_f = √n_s. 하드코팅: 긁힘 방지. 발수·방오 코팅."}, {"id": "fab-sum1", "part": "p5", "ptitle": "안경조제가공", "f": "안경조제가공: 처방 변환", "b": "구면-원주 전환(transposition): 새 S = S + C, 새 C = −C, 새 축 = 축 ± 90°. 토릭 변환: 기준곡면(BC)을 정하고 전면 구면 커브 = (축 방향 굴절력) − BC, 교차커브 = BC + C."}, {"id": "fab-sum2", "part": "p5", "ptitle": "안경조제가공", "f": "안경조제가공: 박스법", "b": "A: 렌즈 수평 폭, B: 수직 높이, DBL: 렌즈 간 거리, FPD(기준점간거리) = A + DBL. 단안 수평 편위량 = (FPD − PD)/2. 유효직경 ED. 최소 렌즈(블랭크) 직경 ≈ ED + 2 × 편위량 + 여유(약 2 mm)."}, {"id": "fab-sum3", "part": "p5", "ptitle": "안경조제가공", "f": "안경조제가공: 프리즘 조제", "b": "편위량 c(cm) = P/F (해당 경선의 굴절력 사용). 플러스 렌즈: 기저 방향으로 광학중심 이동 / 마이너스 렌즈: 기저 반대 방향으로 이동. 예: (−) 렌즈 BI → 광학중심 이측 이동(조제 PD 증가)."}, {"id": "fab-sum4", "part": "p5", "ptitle": "안경조제가공", "f": "안경조제가공: 피팅", "b": "정점간거리 보통 약 12 mm 전후. 전경각(범위 약 8~12°): 전경각 2°마다 광학중심을 동공 중심보다 약 1 mm 낮춤. 안면각(랩) 보정. 코받침·템플 조정, 렌즈 하단 볼 접촉 방지."}, {"id": "fab-sum5", "part": "p5", "ptitle": "안경조제가공", "f": "안경조제가공: 다초점", "b": "이중초점 분절 상단: 대체로 아래눈꺼풀 가장자리 높이. 누진렌즈: 단안 PD와 피팅 높이(동공 중심) 측정, 피팅 포인트를 동공 중심에, 가입도는 숨은 각인으로 확인. 렌즈미터로 가입도 = 근용부 전면정점굴절력 − 원용부 전면정점굴절력."}, {"id": "fab-sum6", "part": "p5", "ptitle": "안경조제가공", "f": "안경조제가공: 점검", "b": "렌즈미터로 구면·원주·축·프리즘·광학중심 확인, 축 오차 허용범위 관련 규격 확인. 축 오차 θ에 의한 잔여 원주 ≈ 2C sin θ (같은 크기 원주가 θ만큼 어긋날 때)."}, {"id": "fab-sum7", "part": "p5", "ptitle": "안경조제가공", "f": "안경조제가공: 수직 프리즘", "b": "좌우 광학중심 높이 차 → 수직 불균형 프리즘 = 높이 차(cm) × 해당 수직경선 굴절력. 수직 융합여력이 작아 작은 값도 불편 유발."}, {"id": "refr-sum1", "part": "p5", "ptitle": "굴절검사", "f": "굴절검사: 검사 순서(예)", "b": "문진 → 예비검사(시력, 동공, 안위·안구운동, 폭주근점, 입체시·색각 등) → 타각적 굴절검사(검영법·자동굴절검사) → 자각적 굴절검사(운무 → 구면 MPMVA → 난시(방사선시표·JCC) → 구면 재정밀 → 양안조절균형) → 근용검사(가입도) → 처방."}, {"id": "refr-sum2", "part": "p5", "ptitle": "굴절검사", "f": "굴절검사: 원용 검사 원리", "b": "운무법: 플러스를 더해 인공 근시 상태로 조절을 이완. MPMVA: 최고 시력을 주는 최대 플러스(최소 마이너스). 적록검사: 적색 선명 → 마이너스 추가(−0.25), 녹색 선명 → 플러스 추가(+0.25)."}, {"id": "refr-sum3", "part": "p5", "ptitle": "굴절검사", "f": "굴절검사: 난시 검사", "b": "방사선시표(운무 상태): 가장 선명한 선의 작은 시계 숫자 × 30 = (−)원주 축. JCC 축 정밀: 더 선명한 면의 (−)축(적색점) 쪽으로 축 이동. JCC 도수 정밀: (−)축이 원주 축과 일치할 때 선명 → (−)원주 추가. 원주 −0.50 D 변경 시 구면 +0.25 D 보정(등가구면 유지)."}, {"id": "refr-sum4", "part": "p5", "ptitle": "굴절검사", "f": "굴절검사: 검영법", "b": "동행 → 플러스 추가, 역행 → 마이너스 추가, 중화점에서 반사 전체가 밝아짐. 작업거리 보정: 측정값 − 1/작업거리(m) (67 cm → −1.50 D, 50 cm → −2.00 D)."}, {"id": "refr-sum5", "part": "p5", "ptitle": "굴절검사", "f": "굴절검사: 원시 분류", "b": "총원시 = 잠복원시 + 현성원시, 현성원시 = 수의원시 + 절대원시. 잠복원시는 조절마비 후 드러남(안경사는 약제 사용 불가)."}, {"id": "refr-sum6", "part": "p5", "ptitle": "굴절검사", "f": "굴절검사: 난시 분류", "b": "직난시: 수직경선 굴절력이 더 강함 — (−)원주 축 180°±30°. 도난시: (−)원주 축 90°±30°. 사난시: 그 외. 단성·복성·혼합난시 구분은 두 주경선의 초선 위치로."}, {"id": "refr-sum7", "part": "p5", "ptitle": "굴절검사", "f": "굴절검사: 근용 검사", "b": "가입도: FCC(융합 교차원주)·MEM 검영·NRA/PRA 균형(가입도 + (NRA+PRA)/2) 등. 가입도는 &#x27;최소 필요량&#x27;으로 처방."}, {"id": "refr-sum8", "part": "p5", "ptitle": "굴절검사", "f": "굴절검사: 윤리", "b": "약제 사용 금지, 6세 이하 의사 처방, 질환 의심 시 안과 의뢰, 고객 정보 비밀 유지."}, {"id": "p6-core1", "part": "p6", "ptitle": "파트6 CL·실기", "f": "CL·실기 핵심 1 ?", "b": "Dk = 재료의 산소 투과성, Dk/t = 렌즈 두께까지 넣은 산소 전달률. 두꺼우면(고도수) 줄어요."}, {"id": "p6-core2", "part": "p6", "ptitle": "파트6 CL·실기", "f": "소프트 ?", "b": "소프트: 스티프(꽉 낌) → BC 큰 값(플랫하게), 플랫(헐거움) → BC 작은 값."}, {"id": "p6-core3", "part": "p6", "ptitle": "파트6 CL·실기", "f": "RGP 형광 ?", "b": "RGP 형광: 가운데 고임 = 스티프, 가운데 접촉 = 플랫. 눈물렌즈로 각막 난시를 교정."}, {"id": "p6-core4", "part": "p6", "ptitle": "파트6 CL·실기", "f": "CL·실기 핵심 4 ?", "b": "통증·충혈·시력저하 CL 착용자 → 착용 중단, 안과 의뢰. 안경사는 약제를 쓰지 않아요."}, {"id": "p6-core5", "part": "p6", "ptitle": "파트6 CL·실기", "f": "실기는 「상황 → 측정값 → 판단」 ?", "b": "실기는 「상황 → 측정값 → 판단」: 부호·축·단위 → 공식 → 처치 방향."}, {"id": "cl-sum1", "part": "p6", "ptitle": "콘택트렌즈", "f": "콘택트렌즈: 정점간거리 보정", "b": "F_CL = F_안경/(1 − dF_안경). −6.00 D @12 mm → −5.60 D(주문 −5.50), +6.00 D @12 mm → +6.47 D(주문 +6.50). 원주 처방은 두 주경선을 각각 보정."}, {"id": "cl-sum2", "part": "p6", "ptitle": "콘택트렌즈", "f": "콘택트렌즈: 눈물렌즈·SAM-FAP", "b": "RGP BC가 각막 K보다 스티프(곡률반경 작음) → 플러스 눈물렌즈 → CL에 같은 양의 마이너스 추가(SAM: Steeper Add Minus). 플랫 → 마이너스 눈물렌즈 → 플러스 추가(FAP). 대략 0.05 mm ≈ 0.25 D (K 약 7.8 mm 부근)."}, {"id": "cl-sum3", "part": "p6", "ptitle": "콘택트렌즈", "f": "콘택트렌즈: 잔여난시", "b": "구면 RGP: 각막 전면 난시는 눈물렌즈가 교정 → 잔여난시 ≈ 굴절난시 − 각막난시(내부·수정체 난시). 소프트 구면렌즈는 각막 난시를 거의 교정하지 못함."}, {"id": "cl-sum4", "part": "p6", "ptitle": "콘택트렌즈", "f": "콘택트렌즈: 재질", "b": "Dk(산소투과성), Dk/t(산소전달률). Holden-Mertz 기준: 일상착용 Dk/t ≥ 24, 연속착용 ≥ 87 (×10⁻⁹). 하이드로겔: 함수율 ↑ → Dk ↑. 실리콘하이드로겔: 실리콘이 산소 운반 → 함수율 낮아도 Dk 높음(반비례 경향)."}, {"id": "cl-sum5", "part": "p6", "ptitle": "콘택트렌즈", "f": "콘택트렌즈: 소프트 피팅", "b": "스티프: 움직임 적음, 순목 직후 일시적 선명, 결막 압박 자국·충혈 → BC 플랫하게(큰 값)·직경 작게. 플랫: 과도한 움직임, 가장자리 들뜸, 시력 변동 → BC 스티프하게(작은 값)·직경 크게. 직경 증가 = 새그 증가 = 스티프 효과. 푸시업 검사로 밀착도 평가."}, {"id": "cl-sum6", "part": "p6", "ptitle": "콘택트렌즈", "f": "콘택트렌즈: RGP 피팅", "b": "플루오레세인: 정렬(얇고 균일), 스티프(중심 고임·중간주변 접촉, 기포), 플랫(중심 접촉·주변 고임). 3–9시 착색: 가장자리 형태·순목 불완전. 하방 중심이탈: 렌즈 무게·플랫 → 직경·디자인 조정."}, {"id": "cl-sum7", "part": "p6", "ptitle": "콘택트렌즈", "f": "콘택트렌즈: 토릭 소프트", "b": "축 회전 보정 LARS: 검사자가 볼 때 마크가 왼쪽(시계 방향)으로 회전 → 축에 더함, 오른쪽(반시계) → 뺌."}, {"id": "cl-sum8", "part": "p6", "ptitle": "콘택트렌즈", "f": "콘택트렌즈: 특수렌즈·관리", "b": "오르토케라톨로지(역기하): 중심각막 편평화로 근시 일시 감소. 원추각막: RGP(3점 접촉)·하이브리드·공막렌즈. 노안: 모노비전(우세안 원용), 동시시 멀티포컬, 교대시. 관리: 다목적용액(세척·헹굼·소독·보존), 과산화수소(중화 필수), 단백질 제거, 수돗물 금지."}, {"id": "cl-sum9", "part": "p6", "ptitle": "콘택트렌즈", "f": "콘택트렌즈: 합병증", "b": "저산소: 미세낭포, 각막부종·줄무늬(striae), 신생혈관. GPC, CLARE, 미생물 각막염(녹농균·가시아메바)."}, {"id": "prac-sum1", "part": "p6", "ptitle": "실기시험(시광학 실무)", "f": "실기시험(시광학 실무): 출제 영역", "b": "굴절검사 실무(예비검사·원용·근용 가입도), 조제 및 가공 실무(설계·피팅·형판·렌즈굴절력 측정·산각·점검, 특수 조제: 평산각·역산각, 다초점, 보호안경, 복식 알바이트, 프리즘), 시기능이상 실무, 콘택트렌즈 실무, 안경상품의 특성 및 선택 (국시원 출제범위)."}, {"id": "prac-sum2", "part": "p6", "ptitle": "실기시험(시광학 실무)", "f": "실기시험(시광학 실무): 풀이 전략", "b": "실기는 &#x27;상황 → 측정값 → 판단/처치&#x27; 구조가 많다. ① 주어진 값의 의미(부호·축·단위) 확인 ② 공식 적용(프렌티스, 정점간거리, SAM-FAP, LARS, Sheard, Hofstetter) ③ 처치 방향(+/−, BI/BO, 플랫/스티프) 검토."}, {"id": "prac-sum3", "part": "p6", "ptitle": "실기시험(시광학 실무)", "f": "실기시험(시광학 실무): 핵심 처치 규칙", "b": "MPMVA, 적색 → −, 녹색 → +. (−)렌즈 BI → 광학중심 이측, BO → 비측. 소프트 스티프 → BC 큰 값, 플랫 → 작은 값. RGP 중심 접촉(플랫) → BC 작은 값(스티프). 렌즈가 높은 쪽 → 그쪽 템플을 위로 굽힘(또는 반대쪽 템플을 아래로)."}, {"id": "prac-sum4", "part": "p6", "ptitle": "실기시험(시광학 실무)", "f": "실기시험(시광학 실무): 안전·윤리", "b": "통증·충혈·시력저하를 동반한 CL 착용자: 즉시 착용 중단, 안과 진료 권유. 약제 사용 금지. 6세 이하 의사 처방."}, {"id": "inst-sum1", "part": "p6", "ptitle": "안광학기기", "f": "안광학기기: 검영기", "b": "선상 검영기: 반사광 이동으로 굴절 판정 — 동행(with) → 플러스 추가, 역행(against) → 마이너스, 중화 시 동공 전체 밝음. 작업거리 보정 필수."}, {"id": "inst-sum2", "part": "p6", "ptitle": "안광학기기", "f": "안광학기기: 자동굴절검사기", "b": "적외선 이용, 무운무 시 기계근시(instrument myopia) 경향 → 운무 시표 내장. 결과는 자각검사의 출발점."}, {"id": "inst-sum3", "part": "p6", "ptitle": "안광학기기", "f": "안광학기기: 각막곡률계", "b": "각막 전면 중심부 약 3 mm 영역의 곡률반경 측정, 환산 굴절률 1.3375 → K(D) = 337.5 / r(mm). 이중상 원리(doubling): 안구 미세운동 영향 감소. 헬름홀츠형(가변 이중상) / 자발형(Javal-Schiøtz, 고정 이중상·가변 물체)."}, {"id": "inst-sum4", "part": "p6", "ptitle": "안광학기기", "f": "안광학기기: 포롭터", "b": "구면·원주 렌즈, 회전(리슬리) 프리즘, JCC, 보조렌즈: O(개방), OC(가림), R(검영 +1.50 D, 67 cm), PH(핀홀), RL/GL(적·녹 필터), RMH/RMV(적색 마독스 수평/수직), WMH/WMV, P(편광), 6ΔU, 10ΔI, ±.50(FCC) 등."}, {"id": "inst-sum5", "part": "p6", "ptitle": "안광학기기", "f": "안광학기기: 렌즈미터", "b": "후면정점굴절력 측정(바달 원리: 측정 렌즈 후면을 표준렌즈 초점에 둠). 프리즘: 동심원(1 Δ 간격). 축·광학중심 표시."}, {"id": "inst-sum6", "part": "p6", "ptitle": "안광학기기", "f": "안광학기기: 렌즈 측정기", "b": "구면계(렌즈 클락): 굴절률 1.53 기준 눈금 → 실제 면굴절력 = 눈금 × (n − 1)/0.53. 두께 게이지, 왜곡(응력)검사기: 편광판 사이 렌즈 → 응력 줄무늬."}, {"id": "inst-sum7", "part": "p6", "ptitle": "안광학기기", "f": "안광학기기: 기타", "b": "세극등: 직접·간접·후방조명, 경면반사(각막 내피), 공막산란(각막 부종·혼탁), 플루오레세인+코발트블루. 직상검안경: 정립상, 약 15배, 좁은 시야 / 간접검안경: 도립상, 넓은 시야. 안압계: 골드만 압평(표준), 비접촉(공기분사). 시야계: 골드만(동적), 험프리(정적 자동). 근점자(RAF rule): 근점·폭주근점."}, {"id": "p7-core1", "part": "p7", "ptitle": "파트7 안과·양안시", "f": "외안근 신경 ?", "b": "외안근 신경: LR6 SO4, 나머지 3. 상사근 1차 작용은 내회선."}, {"id": "p7-core2", "part": "p7", "ptitle": "파트7 안과·양안시", "f": "방수 ?", "b": "방수: 섬모체 → 뒷방 → 동공 → 앞방 → 섬유주 → 쉴렘관. 막히면 안압↑."}, {"id": "p7-core3", "part": "p7", "ptitle": "파트7 안과·양안시", "f": "증상 → 질환 ?", "b": "증상 → 질환: 갑작스러운 통증·충혈·무지개 달무리 = 급성폐쇄각녹내장(즉시 의뢰), 번쩍임·날파리·커튼 = 망막박리(즉시 의뢰)."}, {"id": "p7-core4", "part": "p7", "ptitle": "파트7 안과·양안시", "f": "가림-가림제거 ?", "b": "가림-가림제거: 가렸던 눈이 바깥 → 안으로 움직이면 외사위(교정 BI), 안 → 바깥이면 내사위(교정 BO)."}, {"id": "p7-core5", "part": "p7", "ptitle": "파트7 안과·양안시", "f": "Sheard ?", "b": "Sheard: 보상 융합 여력 ≥ 사위량의 2배. Hofstetter 평균 조절력 18.5 − 0.3×나이."}, {"id": "p7-bv-must", "part": "p7", "ptitle": "파트7 안과·양안시", "f": "양안시: 조절·폭주·사위 — 필수 암기", "b": "외사위 → BI, 내사위 → BO, 상사위 → 그 눈 BD · Sheard: 융합 여력 ≥ 2 × 사위 · Percival: 융합 범위의 가운데 1/3 · 마독스 교차성 복시 = 외편위"}, {"id": "anat-sum1", "part": "p7", "ptitle": "시기해부학(눈해부학)", "f": "시기해부학(눈해부학): 안구의 3층막", "b": "외막(섬유막): 각막·공막 / 중막(포도막): 홍채·섬모체(모양체)·맥락막 / 내막: 망막(10층). 안구 내용물: 수정체·방수·유리체."}, {"id": "anat-sum2", "part": "p7", "ptitle": "시기해부학(눈해부학)", "f": "시기해부학(눈해부학): 각막", "b": "5층(상피–보우만층–실질–데스메막–내피). 상피는 재생, 보우만층은 손상 시 반흔. 내피는 성인에서 거의 분열하지 않으며 펌프 기능으로 각막 탈수(투명성)를 유지. 무혈관, 삼차신경(제1분지) 감각. 굴절력 약 +43 D로 눈 전체(약 +60 D)의 약 2/3."}, {"id": "anat-sum3", "part": "p7", "ptitle": "시기해부학(눈해부학)", "f": "시기해부학(눈해부학): 방수 순환", "b": "섬모체 비색소상피에서 생성 → 후방 → 동공 → 전방 → 전방각 섬유주 → 쉴렘관 → 집합관 → 상공막정맥(주경로). 보조 경로: 포도막공막 유출."}, {"id": "anat-sum4", "part": "p7", "ptitle": "시기해부학(눈해부학)", "f": "시기해부학(눈해부학): 홍채·섬모체", "b": "동공괄약근: 부교감(동안신경, CN III) → 축동. 동공산대근: 교감 → 산동. 섬모체근 수축(부교감) → 섬모소대 이완 → 수정체 두꺼워짐 → 조절."}, {"id": "anat-sum5", "part": "p7", "ptitle": "시기해부학(눈해부학)", "f": "시기해부학(눈해부학): 망막", "b": "원뿔세포(약 600~700만, 황반·중심와 집중, 명소시·색각), 막대세포(약 1억 2천만, 주변부, 암소시). 중심와: 원뿔세포만, 무혈관. 시신경유두: 시세포 없음 → 맹점. 외층(시세포)은 맥락막모세혈관, 내층은 망막중심동맥(안동맥 분지)이 영양."}, {"id": "anat-sum6", "part": "p7", "ptitle": "시기해부학(눈해부학)", "f": "시기해부학(눈해부학): 외안근 6개", "b": "내직근·상직근·하직근·하사근: 동안신경(CN III) / 상사근: 활차신경(CN IV) / 외직근: 외전신경(CN VI) — 암기 &#x27;LR6 SO4, 나머지 3&#x27;. 상사근 1차작용 내회선, 하사근 1차작용 외회선."}, {"id": "anat-sum7", "part": "p7", "ptitle": "시기해부학(눈해부학)", "f": "시기해부학(눈해부학): 안와·눈꺼풀·눈물", "b": "안와 7개 뼈: 이마뼈(전두골)·나비뼈(접형골)·벌집뼈(사골)·눈물뼈(누골)·위턱뼈(상악골)·광대뼈(관골)·입천장뼈(구개골). 눈둘레근: 안면신경(CN VII), 눈꺼풀올림근: CN III, 뮐러근: 교감. 눈물 배출: 눈물점 → 눈물소관 → 눈물주머니 → 코눈물관 → 아래콧길(하비도)."}, {"id": "anat-sum8", "part": "p7", "ptitle": "시기해부학(눈해부학)", "f": "시기해부학(눈해부학): 유전", "b": "적록색각이상: X염색체 연관 열성 → 남성에서 흔함."}, {"id": "phys-sum1", "part": "p7", "ptitle": "시기생리학(눈생리학)", "f": "시기생리학(눈생리학): 시력", "b": "소수시력 V = 1 / 최소분리각(분). 1.0 = 1′, 0.5 = 2′, 0.1 = 10′. Snellen 20/40 = 0.5. logMAR = log₁₀(MAR, 분): 1′ → 0.0, 2′ → 0.30, 10′ → 1.0."}, {"id": "phys-sum2", "part": "p7", "ptitle": "시기생리학(눈생리학)", "f": "시기생리학(눈생리학): 시야", "b": "정상 단안 시야(대략): 이측 90~100°, 하측 약 70°, 비측 약 60°, 상측 약 50~60°. 생리적 맹점: 고시점 이측 약 12~17°, 수평선 약간 아래."}, {"id": "phys-sum3", "part": "p7", "ptitle": "시기생리학(눈생리학)", "f": "시기생리학(눈생리학): 광각", "b": "명소시(원뿔세포) 최대 시감도 555 nm, 암소시(막대세포, 로돕신) 507 nm → 푸르킨예 현상(어두워지면 청록색이 상대적으로 밝게). 암순응: 원뿔세포 약 7~10분에 1차 평탄, 막대세포 포함 약 30분 이상."}, {"id": "phys-sum4", "part": "p7", "ptitle": "시기생리학(눈생리학)", "f": "시기생리학(눈생리학): 색각", "b": "삼원색설(S·M·L 원뿔세포, 최대 흡수 약 420·530·560 nm). 제1색각이상(L, 적), 제2색각이상(M, 녹), 제3색각이상(S, 청)."}, {"id": "phys-sum5", "part": "p7", "ptitle": "시기생리학(눈생리학)", "f": "시기생리학(눈생리학): 조절", "b": "조절력 A = 1/근점거리 − 1/원점거리 (m, 부호 포함 버전스). Hofstetter: 최소 15 − 0.25×나이, 평균 18.5 − 0.3×나이, 최대 25 − 0.4×나이 (D)."}, {"id": "phys-sum6", "part": "p7", "ptitle": "시기생리학(눈생리학)", "f": "시기생리학(눈생리학): 근견반응·동공", "b": "근견반응 3요소: 조절·폭주·축동. 대광반사 경로: 망막 → 시신경 → 시삭 → 시개앞핵 → 에딩거-베스트팔핵 → 동안신경 → 섬모체신경절 → 동공괄약근. 아가일로버트슨 동공: 대광반사 소실·근견반응 보존. 호너증후군: 축동·경도 안검하수·무한증(교감). 상대구심동공장애(RAPD): 시신경 질환."}, {"id": "phys-sum7", "part": "p7", "ptitle": "시기생리학(눈생리학)", "f": "시기생리학(눈생리학): 굴절이상", "b": "축성 근시(안축장 증가), 굴절성 근시(굴절력 증가). 안축 1 mm 차이 ≈ 약 3 D(생략안 기준 근사)."}, {"id": "dis-sum1", "part": "p7", "ptitle": "안질환", "f": "안질환: 시력장애 질환", "b": "백내장(연령관련이 가장 흔함, 수정체 혼탁), 당뇨망막병증(비증식: 미세동맥류·점상출혈·경성삼출 / 증식: 신생혈관·유리체출혈·견인망막박리), 연령관련 황반변성(건성: 드루젠·지도형위축 / 습성: 맥락막신생혈관; 변시증·중심암점, 암슬러격자), 망막박리(광시증·비문증·커튼 모양 시야가림)."}, {"id": "dis-sum2", "part": "p7", "ptitle": "안질환", "f": "안질환: 충혈 관련", "b": "결막충혈(주변부 진함, 혈관 이동) vs 섬모체(모양)충혈(각막 주위 진함 — 각막염·포도막염·급성녹내장). 유행성각결막염: 아데노바이러스(8·19·37형 등), 전염성 강함. 알레르기결막염: 가려움·점액성 분비물."}, {"id": "dis-sum3", "part": "p7", "ptitle": "안질환", "f": "안질환: 통증 관련", "b": "각막염(세균·바이러스·진균·가시아메바), 공막염, 안와봉와직염. 가시아메바각막염: 수돗물·수영 + CL, 극심한 통증, 고리 모양 침윤, 방사상 각막신경염."}, {"id": "dis-sum4", "part": "p7", "ptitle": "안질환", "f": "안질환: 시야장애", "b": "녹내장: 진행성 시신경병증 + 특징적 시야결손(비측계단·궁상암점). 통계적 정상 안압 약 10~21 mmHg. 급성폐쇄각녹내장: 극심한 안통·두통·구역, 충혈, 각막부종(무지개 달무리), 중등도 산동 고정."}, {"id": "dis-sum5", "part": "p7", "ptitle": "안질환", "f": "안질환: 눈꺼풀·눈물", "b": "맥립종(다래끼): 급성 화농성, 통증 / 산립종(콩다래끼): 마이봄샘 만성 육아종성 염증, 무통성 결절. 건성안: 쉬르머 검사, 눈물막파괴시간(TBUT) 10초 미만이면 불안정."}, {"id": "dis-sum6", "part": "p7", "ptitle": "안질환", "f": "안질환: CL 관련", "b": "거대유두결막염(GPC, 위눈꺼풀결막 유두), 저산소(미세낭포·각막부종·신생혈관), 3–9시 각막 착색(RGP), 미생물 각막염."}, {"id": "dis-sum7", "part": "p7", "ptitle": "안질환", "f": "안질환: 기타", "b": "원추각막: 각막 중심/하방 얇아짐·원뿔형 돌출, 불규칙 근시성 난시, 플라이셔 고리, 먼슨 징후, 보그트 선."}, {"id": "bv-sum1", "part": "p7", "ptitle": "시기능이상(양안시기능)", "f": "시기능이상(양안시기능): 양안시 3단계", "b": "동시시 → 융합 → 입체시. 감각 이상: 억제, 이상망막대응, 약시. 입체시 단위: 초(″) (예: 티트무스 40″)."}, {"id": "bv-sum2", "part": "p7", "ptitle": "시기능이상(양안시기능)", "f": "시기능이상(양안시기능): 안위 검사", "b": "가림검사: 한눈가림(cover-uncover) → 사시 판별, 교대가림 → 사위+사시 총편위, 프리즘가림검사로 정량. 마독스로드: 우안 앞 수평 막대 → 수직 선 → 수평 사위 측정. 선이 같은 쪽(동측성) = 내사위, 교차성 = 외사위. 폰 그레페법: 분리 프리즘(예: 6Δ BU) + 측정 프리즘."}, {"id": "bv-sum3", "part": "p7", "ptitle": "시기능이상(양안시기능)", "f": "시기능이상(양안시기능): AC/A", "b": "사위법(계산법): AC/A = PD(cm) + (Δn − Δf)/D_n (내편위 +, 외편위 −, D_n = 1/근거리[m]). 경사법(구배법): AC/A = 렌즈 추가에 따른 근거리 사위 변화량 / 렌즈 굴절력. 정상 약 3~5 Δ/D."}, {"id": "bv-sum4", "part": "p7", "ptitle": "시기능이상(양안시기능)", "f": "시기능이상(양안시기능): 분석 기준", "b": "셰어드(Sheard): 보상 융합여력 ≥ 2 × 사위량, 필요 프리즘 P = (2/3)D − (1/3)R. 퍼시벌(Percival): 편안 시 점이 융합범위 중앙 1/3. 고정시차를 0으로 하는 프리즘 = 연합사위."}, {"id": "bv-sum5", "part": "p7", "ptitle": "시기능이상(양안시기능)", "f": "시기능이상(양안시기능): 대표 이상", "b": "폭주부족: 근거리 외사위 큼, 폭주근점 멀어짐, 낮은 AC/A, BO 여력 부족 → 폭주 훈련 우선, 필요 시 BI. 폭주과다: 근거리 내사위, 높은 AC/A → 근용 플러스 가입. 개산과다: 원거리 외사위 &gt; 근거리, 높은 AC/A. 개산부족: 원거리 내사위 &gt; 근거리, 낮은 AC/A. 조절부족: 연령 기대 최소값(15 − 0.25×나이) 미만 → 근용 플러스."}, {"id": "bv-sum6", "part": "p7", "ptitle": "시기능이상(양안시기능)", "f": "시기능이상(양안시기능): 프리즘 처방", "b": "외사위 → BI, 내사위 → BO, 우안 상사위 → 우안 BD(또는 좌안 BU), 양안에 나누어 처방."}, {"id": "bv-sum7", "part": "p7", "ptitle": "시기능이상(양안시기능)", "f": "시기능이상(양안시기능): 감각기능 검사", "b": "워스 4점(적색 필터 우안·녹색 필터 좌안 관례): 4개 정상 융합, 2개(적) 좌안 억제, 3개(녹) 우안 억제, 5개 복시."}, {"id": "eye-cataract", "part": "p7", "ptitle": "안질환", "f": "백내장 — 증상과 의뢰는?", "b": "증상: 서서히 흐려짐, 눈부심, 밤에 빛 번짐, 단안 복시 / 의뢰: 정기·며칠 안 / 교정시력이 안 오르면 도수만 올리지 말고 안과 의뢰를 권해요."}, {"id": "eye-glaucoma_open", "part": "p7", "ptitle": "안질환", "f": "개방각녹내장 — 증상과 의뢰는?", "b": "증상: 초기에 자각 증상 거의 없음, 주변 시야부터 좁아짐 / 의뢰: 정기 검진 / 증상이 없어도 위험 요인이 있으면 정기 안과 검진을 권해요."}, {"id": "eye-glaucoma_closed", "part": "p7", "ptitle": "안질환", "f": "급성폐쇄각녹내장 — 증상과 의뢰는?", "b": "증상: 갑작스러운 심한 눈 통증·두통, 구역·구토, 불빛 주위 무지개 달무리, 시력 저하 / 의뢰: 즉시 / 응급이에요. 안경사는 약제를 쓰지 않으며 즉시 안과로 보내요."}, {"id": "eye-dr", "part": "p7", "ptitle": "안질환", "f": "당뇨망막병증 — 증상과 의뢰는?", "b": "증상: 초기 무증상, 진행하면 시력 저하·떠다니는 것 / 의뢰: 정기(증상 있으면 며칠 안) / 당뇨 손님은 도수가 흔들릴 수 있어 처방 전 안과 검진을 권해요."}, {"id": "eye-amd", "part": "p7", "ptitle": "안질환", "f": "연령관련 황반변성 — 증상과 의뢰는?", "b": "증상: 중심 시력 저하, 직선이 휘어 보임(변시증), 중심 암점 / 의뢰: 며칠 안(갑작스러우면 즉시) / 안경으로 중심 시력이 안 나오면 황반 질환을 의심해요."}, {"id": "eye-rd", "part": "p7", "ptitle": "안질환", "f": "망막박리 — 증상과 의뢰는?", "b": "증상: 번쩍임(광시증), 날파리 급증(비문증), 커튼이 내려오듯 가림 / 의뢰: 즉시 / 응급이에요. 시야 가림을 호소하면 바로 안과로 보내요."}, {"id": "eye-conj", "part": "p7", "ptitle": "안질환", "f": "결막염 — 증상과 의뢰는?", "b": "증상: 충혈, 이물감, 분비물 / 의뢰: 며칠 안 / CL 착용을 멈추게 하고 손 위생을 안내해요. 시험용 렌즈·기구는 소독해요."}, {"id": "eye-ulcer", "part": "p7", "ptitle": "안질환", "f": "각막염·각막궤양 (CL 관련) — 증상과 의뢰는?", "b": "증상: 통증, 충혈, 눈부심, 눈물, 시력 저하 / 의뢰: 즉시 / CL 착용자의 통증·충혈은 착용 중단 후 즉시 안과로."}, {"id": "eye-uveitis", "part": "p7", "ptitle": "안질환", "f": "포도막염(앞포도막염) — 증상과 의뢰는?", "b": "증상: 통증, 눈부심, 충혈, 시력 저하 / 의뢰: 즉시·며칠 안 / 결막염과 달리 각막 가장자리 주위가 붉고 눈부심이 심하면 의뢰해요."}, {"id": "eye-lid", "part": "p7", "ptitle": "안질환", "f": "눈꺼풀 질환 — 증상과 의뢰는?", "b": "증상: 다래끼(맥립종): 붓고 아픔 / 산립종(콩다래끼): 통증 없는 단단한 혹 / 안검염: 가장자리 딱지·가려움 / 의뢰: 며칠 안·정기 / 눈꺼풀 위생(온찜질·세정)을 안내하고, 커지거나 반복되면 안과로."}, {"id": "eye-kc", "part": "p7", "ptitle": "안질환", "f": "원추각막 (CL 관련) — 증상과 의뢰는?", "b": "증상: 진행하는 근시·불규칙 난시, 안경으로 시력이 잘 안 나옴 / 의뢰: 며칠 안·정기 / RGP 렌즈가 교정에 도움이 될 수 있어요. 진행 여부는 안과에서 확인해요."}]};</script><script>(function(){

function onPreview(){return CFG.preview_host && location.hostname.indexOf(CFG.preview_host) >= 0;}
// 링크: 로컬/일반 호스팅은 상대 경로, html-preview에서는 미리보기 주소로 감싸기, 한 파일(offline)에서는 페이지 안 이동
function L(p){

  }
  if (onPreview()) return CFG.qr_base + p;

    var p = {}; h.split('&').forEach(function(kv){ var x = kv.split('='); p[x[0]] = x[1]; });
    if (p.ch) $('#qz-cat', root).value = 'ch:' + p.ch;
    if (p.part){ var o = document.createElement('option'); o.value = 'part:' + p.part; o.textContent = '파트 전체'; $('#qz-cat', root).appendChild(o); $('#qz-cat', root).value = 'part:' + p.part; }
    if (p.mt) $('#qz-mt', root).value = p.mt;
    if (p.tier){ tier = p.tier; $$('.chip', tw).forEach(function(c){ c.classList.toggle('on', c.textContent === tier); }); }
    if (p.mode === 'weak') weak(); else if (p.mode === 'mock') mock(); else if (p.mode === 'gichul') gc(); else go();
    if (D.offline){ var z = document.getElementById('quiz'); if (z) z.scrollIntoView(); }
    return true;
  }
  window.addEventListener('hashchange', applyHash);
  if (!applyHash()) go();
}

// ---------- 플래시카드 (라이트너) ----------
var INTERVAL = [0, 1, 3, 7, 14];
function mountCards(root){
  var cards = D.cards || [], DAY = 86400000;
  root.innerHTML = '<div class="card"><div class="boxes" id="fc-boxes"></div><div class="ctrl"><select id="fc-part"><option value="">모든 파트</option>' + (D.partsSel || []).map(function(p){ return '<option value="' + p.key + '">' + p.title + '</option>'; }).join('') + '</select></div></div><div class="flash" id="fc"></div><div class="ctrl"><button class="btn l" id="fc-show" type="button">뒤집기</button><button class="btn g" id="fc-ok" type="button">알았어요</button><button class="btn o" id="fc-no" type="button">몰랐어요</button></div>';
  var cur = null, part = '';
  function st(c){ return S.cards[c.id] || {b:0, due:0}; }
  function counts(){ var n = [0, 0, 0, 0, 0]; cards.forEach(function(c){ n[st(c).b]++; }); $('#fc-boxes', root).innerHTML = n.map(function(x, i){ return '<span>' + (i < 4 ? '상자' + (i + 1) : '완료') + ' ' + x + '</span>'; }).join(''); }
  function next(){
    var now = Date.now(); var pool = cards.filter(function(c){ return (!part || c.part === part) && st(c).due <= now; });
    counts();
    if (!pool.length){ $('#fc', root).innerHTML = '<p>오늘 볼 카드를 다 봤어요. 내일 다시 와요!</p>'; cur = null; return; }
    pool.sort(function(a, b){ return st(a).b - st(b).b; }); var low = st(pool[0]).b; pool = shuffle(pool.filter(function(c){ return st(c).b === low; }));
    cur = pool[0]; $('#fc', root).innerHTML = '<div class="meta">' + (cur.ptitle || '') + ' · ' + (st(cur).b < 4 ? '상자' + (st(cur).b + 1) : '완료') + '</div><div class="front">' + cur.f + '</div><div class="back" hidden>' + cur.b + '</div>';
  }
  function mark(ok){ if (!cur) return; var s = st(cur); s.b = ok ? Math.min(4, s.b + 1) : 0; s.due = Date.now() + INTERVAL[s.b] * DAY; S.cards[cur.id] = s; save(); next(); }
  $('#fc-show', root).onclick = function(){ var b = $('#fc .back', root); if (b) b.hidden = !b.hidden; };
  $('#fc-ok', root).onclick = function(){ mark(true); }; $('#fc-no', root).onclick = function(){ mark(false); };
  $('#fc-part', root).onchange = function(){ part = this.value; next(); };
  next();
}

// ---------- 질문 바 (AI로 연결) ----------
function askUrl(svc, text){
  var cat = (document.body.getAttribute('data-cat') || '기타');
  var prompt = '저는 한국 안경사 국가시험을 준비하는 학생입니다. [' + cat + '] 쉬운 말로, 근거(이론·공식·법조문)와 함께 설명해 주세요: ' + text;
  return (svc === 'gpt' ? 'https://chatgpt.com/?q=' : 'https://grok.com/?q=') + encodeURIComponent(prompt);
}
function mountAsk(){
  var f = $('#askform'); if (!f) return;
  function go(svc){ var t = $('#askq').value.trim(); if (!t){ $('#askq').focus(); return; } window.open(askUrl(svc, t), '_blank', 'noopener'); }
  f.addEventListener('submit', function(e){ e.preventDefault(); go('grok'); });
  var alt = $('#askalt'); if (alt) alt.addEventListener('click', function(){ go('gpt'); });
  $$('.bigbtns button').forEach(function(b){ b.addEventListener('click', function(){ document.body.setAttribute('data-cat', b.textContent); $$('.bigbtns button').forEach(function(x){ x.classList.toggle('on', x === b); }); var q = $('#askq'); q.placeholder = '[' + b.textContent + '] 궁금한 걸 적어 주세요'; q.focus(); }); });
}

// ---------- 홈: D-day, 오늘, 진행 ----------
function mountHome(){
  var ex = new Date(D.examDate + 'T09:00:00+09:00'), now = new Date();
  var dd = Math.ceil((ex - now) / 86400000), e = $('#dday'); if (e) e.textContent = dd > 0 ? 'D-' + dd : (dd === 0 ? 'D-DAY' : '시험 종료');
  var start = new Date('2026-11-10T00:00:00+09:00'), k = Math.floor((now - start) / 86400000);
  var t = $('#today');
  if (t){
    if (k < 0) t.innerHTML = '11월 10일에 D1부터 시작해요.';
    else if (k < 21){ var d = (k % 10) + 1; t.innerHTML = '오늘은 <b>' + (k < 10 ? '1회차' : (k < 20 ? '2회차' : '마무리')) + ' D' + d + '</b> → <a data-l="d' + (d < 10 ? '0' + d : d) + '.html">오늘 할 일 열기</a>'; }
    else if (dd > 0) t.innerHTML = '지금은 <b>복습 기간</b>이에요 → <a data-l="quiz.html#mode=weak">약한 부분 훈련</a> · <a data-l="quiz.html#mode=mock">모의고사</a>';
    else t.innerHTML = '시험이 끝났어요. 수고했어요!';
  }
  $$('[data-day]').forEach(function(a){ if (S.days[a.getAttribute('data-day')]) a.classList.add('done'); });
  var n = 0, r = 0; Object.keys(S.q).forEach(function(k){ n++; if (S.q[k].last) r++; });
  var st = $('#stats'); if (st){ var w = weakList().slice(0, 3); st.innerHTML = '푼 문제 ' + n + '개 · 최근 정답 ' + r + '개' + (n ? ' (' + Math.round(r / n * 100) + '%)' : '') + (w.length ? '<br>약한 실수 종류: ' + w.map(function(x){ return mtName(x.k) + ' ' + Math.round(x.rate * 100) + '%'; }).join(', ') : ''); }
  fixLinks(t);
}
function mountDayDone(){
  var c = $('#daydone'); if (!c) return; var k = c.getAttribute('data-d');
  c.checked = !!S.days[k]; c.addEventListener('change', function(){ S.days[k] = c.checked ? Date.now() : 0; save(); });
}
// ---------- 해시 → 섹션 이동 ----------
function scrollHash(){
  var h = decodeURIComponent(location.hash.slice(1)); if (!h || h.indexOf('=') >= 0) return;
  var el = document.getElementById(h); if (el) setTimeout(function(){ el.scrollIntoView(); }, 60);
}
// ---------- QA 훅 (#qa 일 때만) ----------
function qa(){
  if (location.hash.indexOf('qa') < 0) return;
  var W = document.documentElement.clientWidth, over = [];
  $$('body *').forEach(function(el){ var r = el.getBoundingClientRect(); if (r.width > 0 && (r.right > W + 1 || r.left < -1) && !el.closest('.tblw') && !el.closest('nav.tabs') && getComputedStyle(el).position !== 'fixed') over.push(el.tagName + '.' + el.className); });
  var b = $('.q .opt'), clicked = 'none';
  if (b){ b.click(); var d = b.closest('.q').querySelector('.diag'); clicked = d && !d.hidden ? 'ok' : 'fail'; var s = d && d.querySelector('.sim'); if (s){ s.click(); clicked += (d.querySelector('.simbox .q') ? '+sim' : '+nosim'); } }
  document.body.setAttribute('data-qa', JSON.stringify({w:W, sw:document.documentElement.scrollWidth, over:over.slice(0, 10), click:clicked, qn:$$('.q').length}));
}
document.addEventListener('DOMContentLoaded', function(){
  fixLinks();
  var on = $('nav.tabs a.on'); if (on) on.parentNode.scrollLeft = Math.max(0, on.offsetLeft - 60);
  $$('[data-set]').forEach(mountSet);
  var qz = $('#quizapp'); if (qz) mountQuiz(qz);
  var fc = $('#cardapp'); if (fc) mountCards(fc);
  mountAsk(); mountDayDone();
  if (D.page === 'home' || D.offline) mountHome();
  scrollHash(); window.addEventListener('hashchange', scrollHash);
  setTimeout(qa, 300);
});
})();
</script></body></html>

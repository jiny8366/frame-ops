항: 개설등록의 취소처분을 받은 사람은 그 등록취소처분을 받은 날부터 6개월 이내에 치과기공소 또는 안경업소를 개설하지 못한다.", "th": "「의료기사 등에 관한 법률」(현행, 시행 2026. 9. 11., 국가법령정보센터 원문) — 제24조.", "cite": "", "area": "법규"}, {"id": "law-20", "ch": "law", "part": "p2", "tier": "응용", "tag": "[출제기준 추정]", "mt": "fine", "q": "안경업소 개설자가 폐업을 하고도 신고를 하지 않은 경우의 제재는?", "o": ["100만원 이하의 과태료", "3년 이하의 징역", "면허 취소", "500만원 이하의 벌금", "500만원 이하의 과태료"], "a": 0, "why": null, "e": "제13조(폐업 등의 신고) 위반은 제33조제2항제2호에 따라 100만원 이하의 과태료 대상이다. 또한 시정명령 대상이다(제23조제1항제2호).", "th": "「의료기사 등에 관한 법률」(현행, 시행 2026. 9. 11., 국가법령정보센터 원문) — 제13조, 제23조, 제33조.", "cite": "", "area": "법규"}, {"id": "law-21", "ch": "law", "part": "p2", "tier": "기본", "tag": "[출제기준 추정]", "mt": "number", "q": "「의료법」상 의료인에 해당하지 않는 것은?", "o": ["치과의사", "조산사", "안경사", "한의사", "의사"], "a": 2, "why": null, "e": "의료법 제2조: 의료인은 보건복지부장관의 면허를 받은 의사·치과의사·한의사·조산사 및 「간호법」에 따른 간호사를 말한다. 안경사는 「의료기사 등에 관한 법률」에 따른 의료기사등이다.", "th": "「의료법」 제2조 (국가법령정보센터 현행 원문).", "cite": "", "area": "법규"}, {"id": "law-22", "ch": "law", "part": "p2", "tier": "응용", "tag": "[출제기준 추정]", "mt": "number", "q": "「의료법」상 의료광고로 금지되는 것에 해당하는 것은?", "o": ["의료인의 면허 종류 안내", "의료기관의 명칭과 소재지 안내", "진료과목 안내", "환자에 관한 치료경험담 등 치료 효과를 오인하게 할 우려가 있는 광고", "진료 시간 안내"], "a": 3, "why": null, "e": "의료법 제56조제2항제2호는 환자에 관한 치료경험담 등 소비자로 하여금 치료 효과를 오인하게 할 우려가 있는 내용의 광고를 금지한다. 거짓 광고, 비교·비방 광고, 객관적 사실 과장 광고 등도 금지된다.", "th": "「의료법」 제56조.", "cite": "", "area": "법규"}, {"id": "refr-01", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[기출 확인]", "mt": "concept", "q": "A학생을 운무상태에서 난시 검사한 결과 방사선시표 1시 방향이 선명하게 보였다면 (-)원주렌즈 축 방향으로 옳은 것은?", "o": ["30°", "60°", "90°", "120°", "150°"], "a": 0, "why": null, "e": "운무 상태에서 가장 선명한 선(1시–7시 선)의 작은 시계 숫자 1에 30을 곱하면 (−)원주렌즈 축 = 1 × 30° = 30°이다.", "th": "'30배 법칙': 가장 선명하게 보이는 선 방향의 작은 시계 숫자 × 30 = 교정 (−)원주 축. 선명한 선은 망막에 가장 가까이 초선을 맺는 경선에 대응한다.", "cite": "출처: 한국보건의료인국가시험원, 「2025년도 안경사 국가시험 종합안내서」(2025.8.) Ⅲ-2. 예시문항 (문항 원문 인용, 정답·풀이는 이 자료의 풀이). 국시원 출제정보: https://www.kuksiwon.or.kr", "area": "응용"}, {"id": "refr-02", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "자각적 굴절검사에서 운무법(fogging)을 사용하는 주된 목적은?", "o": ["조절을 이완시키기 위해", "동공을 축소시키기 위해", "양안시를 차단하기 위해", "난시 축을 고정하기 위해", "폭주를 유발하기 위해"], "a": 0, "why": null, "e": "플러스 렌즈를 추가해 눈을 인공적인 근시 상태(초점이 망막 앞)로 만들면 조절해도 상이 더 흐려지므로 조절이 이완된다.", "th": "운무량은 보통 시력이 0.3~0.5 정도로 떨어질 만큼(약 +0.75~+1.50 D) 추가.", "cite": "", "area": "응용"}, {"id": "refr-03", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "unit", "q": "50 cm 작업거리에서 검영법으로 +3.00 D에서 중화되었다. 이 눈의 실제 굴절이상은?", "o": ["−1.00 D", "+1.00 D", "+2.00 D", "+3.00 D", "+5.00 D"], "a": 1, "why": null, "e": "작업거리 50 cm의 보정량은 1/0.50 = 2.00 D이므로 실제 굴절이상 = +3.00 − 2.00 = +1.00 D(원시).", "th": "검영법 작업거리 보정: 순굴절 = 총 중화 렌즈 − 1/작업거리.", "cite": "", "area": "응용"}, {"id": "refr-04", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "적록검사에서 피검자가 적색 바탕의 시표가 더 선명하다고 응답했다. 다음 조치로 옳은 것은?", "o": ["검사를 즉시 종료한다.", "원주렌즈 축을 90° 돌린다.", "−0.25 D를 추가한다.", "프리즘을 추가한다.", "+0.25 D를 추가한다."], "a": 2, "why": null, "e": "눈의 종색수차로 적색 초점은 녹색보다 뒤에 맺힌다. 적색이 선명하다는 것은 초점이 망막 앞(근시 미교정 또는 원시 과교정)에 있다는 뜻이므로 마이너스를 추가한다.", "th": "'RAM–GAP': Red → Add Minus, Green → Add Plus. 색각이상자도 명암 차이로 시행 가능.", "cite": "", "area": "응용"}, {"id": "refr-05", "ch": "refr", "part": "p5", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "(−)원주렌즈로 교정 중 잭슨 크로스실린더(JCC)로 원주 축을 정밀검사할 때, 1면과 2면 중 더 선명한 면의 JCC (−)축(적색점) 위치가 현재 축보다 시계 반대 방향(축 값이 커지는 쪽)이었다. 올바른 조치는?", "o": ["JCC를 90° 회전하여 도수 정밀검사를 먼저 반복한다.", "원주 축을 반대 방향으로 돌린다.", "원주 축을 (−)축(적색점) 쪽, 즉 축 값이 커지는 방향으로 조금 돌린다.", "원주 도수를 −0.50 D 추가한다.", "구면을 +0.50 D 추가한다."], "a": 2, "why": null, "e": "축 정밀검사에서는 원주 축을 '더 선명한 면의 JCC (−)축(적색점) 방향'으로 이동시키며(따라가기), 양쪽 면이 같아질 때까지 반복한다. 축 변화량은 원주 도수가 작을수록 크게(예: 15°), 클수록 작게(예: 5°) 한다.", "th": "JCC ±0.25 D: (−)축은 적색점, (+)축은 백색점. (+)원주 교정 시에는 백색점 쪽으로 이동.", "cite": "", "area": "응용"}, {"id": "refr-06", "ch": "refr", "part": "p5", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "JCC 도수 정밀검사 결과 원주렌즈를 −1.00 D에서 −1.50 D로 증가시켰다. 등가구면을 유지하기 위한 구면 조정은?", "o": ["구면에 +0.50 D 추가", "구면에 −0.50 D 추가", "구면 변화 없음", "구면에 −0.25 D 추가", "구면에 +0.25 D 추가"], "a": 4, "why": null, "e": "원주가 −0.50 D 증가하면 등가구면이 −0.25 D 변하므로, 구면에 +0.25 D를 추가하여 최소착란원을 망막 위에 유지한다.", "th": "등가구면 SE = S + C/2. ΔC = −0.50 → ΔSE = −0.25 → ΔS = +0.25로 보정.", "cite": "", "area": "응용"}, {"id": "refr-07", "ch": "refr", "part": "p5", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "양안 조절균형 검사 방법에 해당하는 것은?", "o": ["세극등 검사", "각막곡률 측정", "수직 프리즘 분리법 또는 교대가림법", "시야 검사", "검영법"], "a": 2, "why": null, "e": "양안 조절균형은 양안을 운무한 상태에서 수직 프리즘(예: 3Δ BU/3Δ BD)으로 상을 분리하거나 교대로 가려 두 눈의 선명도를 비교하고, 더 선명한 눈에 +0.25 D를 추가해 맞춘다.", "th": "균형이 맞지 않으면 우세안을 더 선명하게 둔다.", "cite": "", "area": "응용"}, {"id": "refr-08", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "시력이 낮은 사람에게 핀홀(바늘구멍) 검사를 했더니 시력이 크게 향상되었다. 이 결과가 시사하는 것은?", "o": ["시력저하의 주원인은 굴절이상일 가능성이 높다.", "망막박리가 의심된다.", "황반변성이 원인이다.", "약시가 확실하다.", "시신경 질환이 원인이다."], "a": 0, "why": null, "e": "핀홀은 주변 광선을 차단해 초점심도를 높이므로 굴절이상에 의한 흐림을 줄인다. 시력이 향상되면 굴절 교정으로 시력 개선이 기대되며, 향상되지 않으면 안질환 등을 의심해 의뢰를 고려한다.", "th": "핀홀 직경 약 1~1.2 mm. 너무 작으면 회절로 오히려 흐려진다.", "cite": "", "area": "응용"}, {"id": "refr-09", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "Snellen 시력 20/40을 소수시력으로 바꾸면?", "o": ["0.2", "0.4", "0.5", "0.8", "2.0"], "a": 2, "why": null, "e": "소수시력 = 검사거리/표준거리 = 20/40 = 0.5.", "th": "6/12 = 0.5, 6/6 = 1.0. logMAR 0.3.", "cite": "", "area": "응용"}, {"id": "refr-10", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "원시의 분류에서 '총원시'를 옳게 나타낸 것은?", "o": ["수의원시만", "절대원시 − 수의원시", "수의원시 + 잠복원시", "현성원시 − 잠복원시", "잠복원시 + 현성원시"], "a": 4, "why": null, "e": "총원시 = 잠복원시(조절 긴장으로 숨어 있음, 조절마비 시 드러남) + 현성원시(수의원시 + 절대원시)이다.", "th": "젊을수록 조절력이 커서 잠복원시 비율이 크다 → 운무법 등으로 최대한 조절을 이완.", "cite": "", "area": "응용"}, {"id": "refr-11", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "S −1.00 D ◯ C −1.50 D Ax 180으로 교정되는 눈의 난시 분류는?", "o": ["단성근시성 도난시", "복성근시성 직난시", "혼합난시", "복성근시성 도난시", "복성원시성 직난시"], "a": 1, "why": null, "e": "두 주경선 굴절: 180° 경선 = −1.00 D, 90° 경선 = −2.50 D → 두 초선 모두 망막 앞(복성근시성). 수직경선(90°)의 굴절력이 더 강하므로 직난시((−)원주 축 180°).", "th": "(−)원주 축이 180°±30° → 직난시, 90°±30° → 도난시.", "cite": "", "area": "응용"}, {"id": "refr-12", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "S +1.00 D ◯ C −2.00 D Ax 90으로 교정되는 눈의 난시 분류는?", "o": ["복성근시성 난시", "복성원시성 난시", "단성근시성 난시", "혼합난시", "단성원시성 난시"], "a": 3, "why": null, "e": "90° 경선 = +1.00 D(원시), 180° 경선 = +1.00 + (−2.00) = −1.00 D(근시) → 한 초선은 망막 뒤, 다른 초선은 망막 앞이므로 혼합난시이다.", "th": "교정렌즈 주경선 굴절력: 축 방향 = S, 축과 수직 방향 = S + C.", "cite": "", "area": "응용"}, {"id": "refr-13", "ch": "refr", "part": "p5", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "FCC(융합 교차원주) 근용 검사에서 ±0.50 D 교차원주((−)축 90°)를 넣고 격자 시표를 보였을 때 '가로선이 더 선명하다'고 응답했다. 의미와 조치로 옳은 것은?", "o": ["조절 래그(lag)가 있으므로 양안에 플러스를 추가하여 가로·세로선이 같아지게 한다.", "정상이므로 조치가 필요 없다.", "조절 리드(lead)이므로 마이너스를 추가한다.", "사위가 있으므로 프리즘을 넣는다.", "난시 축이 틀렸으므로 축을 돌린다."], "a": 0, "why": null, "e": "(−)축 90°의 교차원주에서는 가로선 초선이 뒤쪽에 맺힌다. 가로선이 선명하다는 것은 조절 반응이 자극보다 적어(래그) 초점이 망막 뒤에 있다는 뜻이므로 플러스를 추가한다.", "th": "FCC 결과(순플러스)는 잠정 가입도의 참고값이며 NRA/PRA 등으로 확인한다.", "cite": "", "area": "응용"}, {"id": "refr-14", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "안경사가 고객의 굴절검사를 할 때 법령상 허용되지 않는 것은?", "o": ["운무법을 사용하는 것", "검영기 없이 자동굴절검사기를 사용하는 것", "포롭터로 자각적 굴절검사를 하는 것", "사이클로펜톨레이트 등 조절마비제를 점안하여 굴절검사를 하는 것", "적록검사를 시행하는 것"], "a": 3, "why": null, "e": "안경사의 굴절검사는 '약제를 사용하지 않는' 자각적 굴절검사와 자동굴절검사기기를 이용한 타각적 굴절검사로 규정되어 있다. 조절마비제 점안은 할 수 없다.", "th": "「의료기사 등에 관한 법률」 제1조의2, 시행령 [별표 1].", "cite": "", "area": "응용"}, {"id": "refr-15", "ch": "refr", "part": "p5", "tier": "응용", "tag": "[출제기준 추정]", "mt": "age", "q": "NRA(음성상대조절) +2.50 D, PRA(양성상대조절) −1.50 D, 잠정 가입도 +1.00 D일 때 NRA/PRA 균형법으로 조정한 가입도는?", "o": ["+0.50 D", "+1.00 D", "+1.50 D", "+2.00 D", "+2.50 D"], "a": 2, "why": null, "e": "조정 가입도 = 잠정 가입도 + (NRA + PRA)/2 = +1.00 + (+2.50 + (−1.50))/2 = +1.00 + 0.50 = +1.50 D.", "th": "NRA·PRA를 잠정 가입도 위에서 측정하였을 때 적용. NRA와 PRA가 같아지도록 중앙에 맞추는 원리.", "cite": "", "area": "응용"}, {"id": "fab-01", "ch": "fab", "part": "p5", "tier": "기본", "tag": "[기출 확인]", "mt": "base", "q": "다음 처방서에서 렌즈의 조제가공 P.D.는?<br>O.D. : S-2.00D ⁐ C-2.00D Ax 90 ⁐ 2.0△, B.I., 측정기준 P.D. 30mm", "o": ["20 mm", "25 mm", "30 mm", "35 mm", "40 mm"], "a": 3, "why": null, "e": "수평 프리즘이므로 수평(180°) 경선 굴절력을 쓴다. 원주 축이 90°이므로 180° 경선 굴절력 = S + C = −2.00 + (−2.00) = −4.00 D. 편위량 c = P/F = 2.0/4.00 = 0.5 cm = 5 mm. 마이너스 렌즈에서 기저 내방(BI)을 얻으려면 광학중심을 기저 반대쪽(이측)으로 옮겨야 하므로 조제 PD = 30 + 5 = 35 mm.", "th": "프렌티스 법칙 P = cF, 주경선 굴절력(축 방향 = S, 축 수직 방향 = S + C). 마이너스 렌즈: 기저 반대 방향으로 광학중심 이동.", "cite": "출처: 한국보건의료인국가시험원, 「2025년도 안경사 국가시험 종합안내서」(2025.8.) Ⅲ-2. 예시문항 (문항 원문 인용, 정답·풀이는 이 자료의 풀이). 국시원 출제정보: https://www.kuksiwon.or.kr", "area": "응용"}, {"id": "fab-02", "ch": "fab", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "S +2.00 D ◯ C −3.00 D Ax 45를 (+)원주 형식으로 바르게 전환한 것은?", "o": ["S +2.00 D ◯ C +3.00 D Ax 135", "S −1.00 D ◯ C +3.00 D Ax 45", "S −1.00 D ◯ C +3.00 D Ax 135", "S −1.00 D ◯ C −3.00 D Ax 135", "S +5.00 D ◯ C +3.00 D Ax 135"], "a": 2, "why": null, "e": "새 구면 = S + C = +2.00 + (−3.00) = −1.00 D, 새 원주 = +3.00 D, 새 축 = 45° + 90° = 135°.", "th": "구면-원주 전환 3단계: ① 대수합 ② 원주 부호 반전 ③ 축 90° 회전.", "cite": "", "area": "응용"}, {"id": "fab-03", "ch": "fab", "part": "p5", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "처방 S −2.00 D ◯ C −1.00 D Ax 180을 기준곡면(base curve) −6.00 D의 내면 토릭 렌즈로 설계할 때(얇은 렌즈 가정), 전면 구면 커브와 후면 교차커브(cross curve)는?", "o": ["전면 +3.00 D, 교차커브 −6.00 D", "전면 +4.00 D, 교차커브 −5.00 D", "전면 +4.00 D, 교차커브 −7.00 D", "전면 −4.00 D, 교차커브 −7.00 D", "전면 +8.00 D, 교차커브 −7.00 D"], "a": 2, "why": null, "e": "(−)원주 형식에서 기준곡면은 원주 축 방향(180° 경선)에 놓인다. 180° 경선 굴절력 = S = −2.00 D이므로 전면 = −2.00 − (−6.00) = +4.00 D. 교차커브(90° 경선) = 기준곡면 + C = −6.00 + (−1.00) = −7.00 D. 확인: 90° 경선 = +4.00 − 7.00 = −3.00 D = S + C. ✓", "th": "토릭 변환: 전면 구면 = S − BC (원주 부호를 BC와 같게 맞춘 처방), 교차커브 = BC + C.", "cite": "", "area": "응용"}, {"id": "fab-04", "ch": "fab", "part": "p5", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "안경테의 전경각이 10°일 때, 일반적인 원칙(전경각 2°당 1 mm)에 따라 광학중심을 동공 중심보다 얼마나 아래에 위치시키는가?", "o": ["1 mm", "2 mm", "5 mm", "10 mm", "20 mm"], "a": 2, "why": null, "e": "전경각 2°마다 광학중심을 약 1 mm 낮추므로 10° ÷ 2 × 1 mm = 5 mm 아래에 위치시킨다. 그래야 광축이 눈의 회선점을 지나 사입사 비점수차가 줄어든다.", "th": "광학중심 하방 위치 = 전경각에 따른 '회선점 조건'(optical center rotation point requirement).", "cite": "", "area": "응용"}, {"id": "fab-05", "ch": "fab", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "unit", "q": "박스법에서 렌즈 수평 폭(A) 52 mm, 렌즈 간 거리(DBL) 18 mm인 안경테에 PD 64 mm인 고객의 렌즈를 조제할 때 한쪽 렌즈의 수평 편위량과 방향은?", "o": ["3 mm 내측(비측)", "6 mm 내측(비측)", "편위 불필요", "6 mm 외측(이측)", "3 mm 외측(이측)"], "a": 0, "why": null, "e": "FPD = A + DBL = 52 + 18 = 70 mm. 편위량 = (FPD − PD)/2 = (70 − 64)/2 = 3 mm. 고객 PD가 FPD보다 작으므로 광학중심을 각각 3 mm 내측으로 옮긴다.", "th": "FPD(Frame PD) &gt; PD → 내측 편위, FPD &lt; PD → 외측 편위.", "cite": "", "area": "응용"}, {"id": "fab-06", "ch": "fab", "part": "p5", "tier": "심화", "tag": "[출제기준 추정]", "mt": "unit", "q": "유효직경(ED) 56 mm, 단안 편위량 3 mm인 경우 가공 여유 2 mm를 포함한 최소 렌즈(블랭크) 직경은?", "o": ["58 mm", "59 mm", "61 mm", "64 mm", "70 mm"], "a": 3, "why": null, "e": "최소 렌즈 직경 = ED + 2 × 편위량 + 여유 = 56 + 2 × 3 + 2 = 64 mm.", "th": "편위량이 클수록 큰 렌즈가 필요하고, 마이너스 렌즈 가장자리가 두꺼워진다 → FPD가 PD에 가까운 테 선택.", "cite": "", "area": "응용"}, {"id": "fab-07", "ch": "fab", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "base", "q": "+5.00 D 구면렌즈에 2 Δ 기저 내방(BI)을 편위로 만들려고 한다. 광학중심의 이동량과 방향은?", "o": ["4 mm 내측(비측)으로 이동", "4 mm 외측(이측)으로 이동", "10 mm 외측으로 이동", "2.5 mm 내측으로 이동", "0.4 mm 내측으로 이동"], "a": 0, "why": null, "e": "c = P/F = 2/5 = 0.4 cm = 4 mm. 플러스 렌즈는 기저 방향으로 광학중심을 옮기므로 BI를 얻으려면 내측(비측)으로 4 mm 이동한다.", "th": "플러스: 광학중심 이동 방향 = 기저 방향, 마이너스: 반대.", "cite": "", "area": "응용"}, {"id": "fab-08", "ch": "fab", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "이중초점렌즈의 분절 상단 높이를 정하는 일반적인 기준 위치는?", "o": ["위눈꺼풀 가장자리", "동공 중심", "안경테 하단에서 5 mm", "각막 윤부 상단", "아래눈꺼풀 가장자리(하안검연) 높이"], "a": 4, "why": null, "e": "일반적인 이중초점은 분절 상단을 아래눈꺼풀 가장자리(또는 하측 각막윤부) 높이에 맞춘다. 근거리 작업이 많으면 약간 높게, 원거리 위주면 약간 낮게 조정한다.", "th": "삼중초점은 분절 상단을 동공 하연 부근에 맞춘다.", "cite": "", "area": "응용"}, {"id": "fab-09", "ch": "fab", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "누진굴절력렌즈 조제 시 피팅 포인트(fitting cross)의 위치로 옳은 것은?", "o": ["안경테 기하중심", "동공 중심보다 5 mm 위", "아래눈꺼풀 가장자리", "코받침 높이", "원거리 정면 주시 시의 동공 중심"], "a": 4, "why": null, "e": "누진렌즈는 원거리 정면 주시 상태에서 단안 PD와 피팅 높이를 측정해 피팅 포인트를 동공 중심에 맞춘다.", "th": "안면 비대칭이 흔하므로 양안 PD가 아닌 단안 PD를 사용한다.", "cite": "", "area": "응용"}, {"id": "fab-10", "ch": "fab", "part": "p5", "tier": "응용", "tag": "[출제기준 추정]", "mt": "base", "q": "렌즈미터로 프리즘을 측정할 때 시표 중심이 기준 십자선의 위쪽 두 번째 원(1 Δ 간격)에 위치하였다. 이 위치의 프리즘은?", "o": ["2 Δ 기저 하방", "2 Δ 기저 상방", "1 Δ 기저 상방", "4 Δ 기저 상방", "0.5 Δ 기저 하방"], "a": 1, "why": null, "e": "렌즈미터의 동심원은 보통 1 Δ 간격이므로 두 번째 원은 2 Δ이며, 시표가 이동한 방향이 기저 방향이다(위쪽 → 기저 상방).", "th": "수평 프리즘은 좌우 방향과 해당 눈(OD/OS)을 고려하여 BI/BO로 판단한다.", "cite": "", "area": "응용"}, {"id": "fab-11", "ch": "fab", "part": "p5", "tier": "심화", "tag": "[출제기준 추정]", "mt": "base", "q": "양안 모두 −6.00 D(구면) 렌즈를 조제하였는데, 우안 광학중심만 동공 중심보다 2 mm 위에 있고 좌안은 동공 중심과 일치한다. 발생하는 수직 프리즘 불균형은?", "o": ["2.4 Δ (우안 기저 상방)", "0.3 Δ (우안 기저 하방)", "1.2 Δ (우안 기저 상방)", "12 Δ (우안 기저 하방)", "1.2 Δ (우안 기저 하방)"], "a": 4, "why": null, "e": "P = 0.2 cm × 6.00 = 1.2 Δ. 마이너스 렌즈는 광학중심 반대쪽이 기저이므로, 광학중심보다 아래에 있는 동공에서는 기저 하방(BD)이다. 좌안은 0이므로 불균형은 1.2 Δ.", "th": "수직 불균형은 수평보다 융합 여력이 작아 0.5 Δ 정도도 불편을 줄 수 있으므로 광학중심 높이를 정확히 맞춘다.", "cite": "", "area": "응용"}, {"id": "fab-12", "ch": "fab", "part": "p5", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "C −2.00 D 원주렌즈가 처방 축에서 10° 어긋나게 조제되었을 때 발생하는 잔여 원주 굴절력으로 가장 가까운 것은? (같은 크기의 원주가 θ만큼 어긋난 경우의 근사식 2C sin θ 사용)", "o": ["약 0.17 D", "약 0.35 D", "약 0.69 D", "약 1.00 D", "약 2.00 D"], "a": 2, "why": null, "e": "잔여 원주 ≈ 2 × |C| × sin θ = 2 × 2.00 × sin 10° = 4 × 0.1736 = 0.69 D. 원주 도수가 클수록 같은 축 오차에도 잔여 난시가 커진다.", "th": "사교 원주 합성: 크기 같고 부호 반대인 두 원주가 θ 어긋나면 합성 원주 = 2C sin θ.", "cite": "", "area": "응용"}, {"id": "fab-13", "ch": "fab", "part": "p5", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "안경을 착용했을 때 안경이 자꾸 코 아래로 흘러내린다. 가장 적절한 조정은?", "o": ["렌즈를 더 큰 것으로 교체한다.", "안경다리 끝(팁)의 굽힘 위치를 앞당기고 귀 뒤에 밀착되도록 조인다.", "전경각을 크게 한다.", "안경다리를 바깥으로 벌린다.", "코받침 간격을 넓힌다."], "a": 1, "why": null, "e": "흘러내림은 템플 팁의 굽힘 위치가 귀보다 뒤에 있거나 템플이 헐거운 경우가 많다. 굽힘 위치를 귀 뿌리에 맞추고 팁을 귀 뒤 형태에 밀착시키며, 필요하면 코받침 간격을 좁힌다.", "th": "피팅 3점 지지: 코 + 양쪽 귀. 템플 벌어짐(개폐각)·길이·팁 밀착 점검.", "cite": "", "area": "응용"}, {"id": "fab-14", "ch": "fab", "part": "p5", "tier": "응용", "tag": "[출제기준 추정]", "mt": "age", "q": "렌즈미터로 누진굴절력렌즈의 가입도를 측정하는 방법으로 옳은 것은?", "o": ["피팅 포인트에서 한 번만 측정한다.", "근용부 후면정점굴절력에서 원용부 전면정점굴절력을 뺀다.", "가입도는 렌즈미터로 측정할 수 없다.", "렌즈 전면을 렌즈 받침에 대고 근용부와 원용부의 전면정점굴절력 차이를 구한다.", "후면을 대고 원용부만 측정한다."], "a": 3, "why": null, "e": "다초점렌즈의 가입도는 근용 분절(또는 누진면)이 대개 전면에 있으므로 전면을 렌즈 받침에 대고 원용부·근용부의 전면정점굴절력을 측정해 그 차이로 구한다. 누진렌즈는 숨은 각인의 가입도 표기로도 확인한다.", "th": "원용 처방 확인은 후면정점굴절력(후면을 받침에)으로 한다.", "cite": "", "area": "응용"}, {"id": "fab-15", "ch": "fab", "part": "p5", "tier": "응용", "tag": "[출제기준 추정]", "mt": "unit", "q": "고도근시(−8.00 D) 고객의 안경테 선택 조언으로 가장 적절한 것은?", "o": ["전경각이 없는 큰 보잉 선글라스형을 권한다.", "렌즈 크기가 작고 FPD가 고객 PD에 가까운 테를 고르고, 고굴절 렌즈를 권한다.", "렌즈 크기가 큰 테를 고른다.", "무테 투포인트에 CR-39 렌즈를 권한다.", "FPD가 PD보다 10 mm 이상 큰 테를 고른다."], "a": 1, "why": null, "e": "마이너스 렌즈는 가장자리가 두꺼우므로 렌즈 크기가 작고 편위량이 적은(FPD ≈ PD) 테를 고르면 가장자리 두께와 무게가 줄어든다. 고굴절·비구면 렌즈를 함께 권한다.", "th": "가장자리 두께는 렌즈 반경의 제곱에 비례해 증가하는 새그(sag)에 의해 결정된다: s ≈ h²/(2r).", "cite": "", "area": "응용"}, {"id": "fab-16", "ch": "fab", "part": "p5", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "산업용 보호안경이나 무테(투포인트) 안경에 가공 시 균열 위험이 적어 많이 사용하는 렌즈 재료는?", "o": ["플린트유리", "크라운유리", "폴리카보네이트 또는 트라이벡스(Trivex)", "고굴절 유리(n=1.9)", "CR-39 (특히 고도 마이너스 무코팅)"], "a": 2, "why": null, "e": "폴리카보네이트·트라이벡스는 내충격성과 인장강도가 높아 구멍을 뚫는 무테 가공이나 보호안경에 적합하다.", "th": "트라이벡스: n ≈ 1.53, 아베수 약 43~45, 가볍고 내충격성 우수.", "cite": "", "area": "응용"}, {"id": "bv-01", "ch": "bv", "part": "p7", "tier": "심화", "tag": "[출제기준 추정]", "mt": "phoria", "q": "PD 60 mm, 원거리 사위 2 Δ 외사위, 40 cm 근거리 사위 8 Δ 외사위일 때 사위법(계산법)으로 구한 AC/A비는?", "o": ["2.4 Δ/D", "3.6 Δ/D", "4.0 Δ/D", "6.0 Δ/D", "8.4 Δ/D"], "a": 1, "why": null, "e": "AC/A = PD(cm) + (Δn − Δf)/D_n = 6.0 + ((−8) − (−2))/2.5 = 6.0 − 2.4 = 3.6 Δ/D (외편위는 음수).", "th": "계산법은 근접성 폭주가 포함되어 경사법보다 약간 높게 나오는 경향.", "cite": "", "area": "응용"}, {"id": "bv-02", "ch": "bv", "part": "p7", "tier": "기본", "tag": "[출제기준 추정]", "mt": "phoria", "q": "근거리 4 Δ 외사위인 사람에게 양안 −1.00 D를 추가했더니 근거리 정위(0 Δ)가 되었다. 경사법(구배법)으로 구한 AC/A비는?", "o": ["1 Δ/D", "2 Δ/D", "4 Δ/D", "5 Δ/D", "8 Δ/D"], "a": 2, "why": null, "e": "마이너스 1.00 D는 조절 1.00 D를 자극해 조절성 폭주를 일으킨다. 사위가 4 Δ 외 → 0으로 4 Δ 내편위 방향 변화 → AC/A = 4/1 = 4 Δ/D.", "th": "경사법 AC/A = |근거리 사위 변화량| / |추가 렌즈 굴절력|.", "cite": "", "area": "응용"}, {"id": "bv-03", "ch": "bv", "part": "p7", "tier": "심화", "tag": "[출제기준 추정]", "mt": "phoria", "q": "근거리 외사위 6 Δ, 근거리 양성융합성 버전스(BO) 흐림점 10 Δ인 사람에게 셰어드 기준을 적용할 때 필요한 프리즘은?", "o": ["프리즘 불필요", "약 0.67 Δ BI", "약 0.67 Δ BO", "약 2.00 Δ BI", "약 4.00 Δ BI"], "a": 1, "why": null, "e": "셰어드 기준: 보상 여력(R) ≥ 2 × 요구량(D). 2 × 6 = 12 &gt; 10이므로 기준 불충족. P = (2/3)D − (1/3)R = (2/3)(6) − (1/3)(10) = 4 − 3.33 = 0.67 Δ. 외사위이므로 BI.", "th": "셰어드 공식 P = 2/3 D − 1/3 R, P ≤ 0이면 프리즘 불필요. 외사위의 보상 여력은 양성융합성 버전스(BO).", "cite": "", "area": "응용"}, {"id": "bv-04", "ch": "bv", "part": "p7", "tier": "기본", "tag": "[출제기준 추정]", "mt": "phoria", "q": "폭주부족(convergence insufficiency)의 전형적인 소견으로 옳은 것은?", "o": ["근거리 내사위가 크다.", "근거리 외사위가 원거리보다 크고, 폭주근점이 멀어져 있다.", "원거리 내사위가 근거리보다 크다.", "AC/A비가 매우 높다.", "음성융합성 버전스(BI)가 부족하다."], "a": 1, "why": null, "e": "폭주부족은 원거리는 정위 근처인데 근거리에서 외사위가 크고, 폭주근점이 멀며, 양성융합성 버전스(BO)가 부족하고 AC/A가 낮은 것이 특징이다.", "th": "치료: 폭주 훈련(연필 밀기, 브록 줄 등)이 우선, 필요 시 근용 BI 프리즘.", "cite": "", "area": "응용"}, {"id": "bv-05", "ch": "bv", "part": "p7", "tier": "기본", "tag": "[출제기준 추정]", "mt": "phoria", "q": "근거리 내사위가 크고 AC/A비가 높은 폭주과다(convergence excess)에서 가장 효과적인 광학적 처치는?", "o": ["근용 플러스 가입(이중초점 등)", "BI 프리즘", "원용 근시 과교정", "가림 치료", "근용 마이너스 가입"], "a": 0, "why": null, "e": "AC/A가 높으면 플러스 가입으로 조절을 줄였을 때 조절성 폭주가 크게 감소하여 근거리 내사위가 효과적으로 줄어든다.", "th": "필요 가입도 ≈ 줄이고자 하는 내사위량 / AC/A.", "cite": "", "area": "응용"}, {"id": "bv-06", "ch": "bv", "part": "p7", "tier": "응용", "tag": "[출제기준 추정]", "mt": "phoria", "q": "개산과다(divergence excess)의 특징으로 옳은 것은?", "o": ["근거리 내사위가 크다.", "원거리 외사위가 근거리 외사위보다 크고 AC/A비가 높다.", "근거리 외사위가 원거리보다 크다.", "AC/A비가 낮다.", "원거리 내사위가 크다."], "a": 1, "why": null, "e": "개산과다는 원거리에서 외편위가 크고 근거리에서는 작아(높은 AC/A) 원거리 주시 시 간헐외사시로 나타나기도 한다.", "th": "개산부족: 원거리 내사위 &gt; 근거리, 낮은 AC/A → BO 프리즘.", "cite": "", "area": "응용"}, {"id": "bv-07", "ch": "bv", "part": "p7", "tier": "기본", "tag": "[출제기준 추정]", "mt": "phoria", "q": "한눈가림검사(cover-uncover test)에서 우안을 가렸을 때 가리지 않은 좌안이 바깥쪽에서 안쪽으로 움직여 주시하였다. 좌안의 상태로 옳은 것은?", "o": ["좌안 상사시", "좌안 내사시", "좌안 외사위", "정위", "좌안 외사시"], "a": 4, "why": null, "e": "주시하던 우안을 가리면 편위된 좌안이 주시를 위해 움직인다. 바깥쪽에서 안쪽으로(내전) 움직였다면 원래 바깥으로 돌아가 있었던 것이므로 좌안 외사시이다.", "th": "한눈가림에서 가리지 않은 눈의 움직임 → 사시(현성), 가렸던 눈을 뗄 때의 움직임 → 사위(잠복) 판단.", "cite": "", "area": "응용"}, {"id": "bv-08", "ch": "bv", "part": "p7", "tier": "심화", "tag": "[출제기준 추정]", "mt": "phoria", "q": "우안 앞에 적색 마독스로드를 막대가 수평이 되도록 두고 광점을 보게 했더니, 우안으로 보이는 수직 적색선이 광점의 오른쪽에 보였다. 해석으로 옳은 것은?", "o": ["정위", "좌안 상사위", "외사위(교차성 복시)", "내사위(동측성 복시)", "우안 상사위"], "a": 3, "why": null, "e": "수평 막대는 수직 선을 만든다. 우안 앞 마독스로드의 선이 우측(같은 쪽)에 보이는 동측성(비교차) 복시는 내사위를 의미한다. 교정에는 BO 프리즘을 넣어 선이 광점을 지나도록 한다.", "th": "마독스로드: 막대 방향과 보이는 선은 수직. 동측성 = 내편위, 교차성 = 외편위.", "cite": "", "area": "응용"}, {"id": "bv-09", "ch": "bv", "part": "p7", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "워스 4점 검사(우안 적색 필터, 좌안 녹색 필터)에서 적색 점 2개만 보인다고 응답했다. 해석으로 옳은 것은?", "o": ["좌안 억제", "이상망막대응 확정", "우안 억제", "복시", "정상 융합"], "a": 0, "why": null, "e": "적색 2개는 적색 필터를 낀 우안으로만 보고 있다는 뜻이므로 좌안(녹색 필터)이 억제된 것이다.", "th": "4개: 융합(우세안에 따라 백색 점 색이 달라 보일 수 있음), 3개(녹): 우안 억제, 5개: 복시.", "cite": "", "area": "응용"}, {"id": "bv-10", "ch": "bv", "part": "p7", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "티트무스(Titmus) 입체시 검사 결과를 표시하는 단위는?", "o": ["mmHg", "디옵터(D)", "프리즘 디옵터(Δ)", "초(arc second)", "logMAR"], "a": 3, "why": null, "e": "입체시는 두 눈의 망막상 시차 각도로 나타내며, 단위는 각도 초(″)이다. 값이 작을수록 입체시가 좋다.", "th": "정상 근거리 입체시는 대략 40~60″ 이하로 평가하는 경우가 많다.", "cite": "", "area": "응용"}, {"id": "bv-11", "ch": "bv", "part": "p7", "tier": "응용", "tag": "[출제기준 추정]", "mt": "phoria", "q": "±2.00 D 플리퍼 렌즈를 이용하여 1분 동안 선명하게 보는 주기 수(cpm)를 측정하는 검사는?", "o": ["조절용이성 검사", "사위 검사", "폭주근점 검사", "입체시 검사", "조절력 검사(푸시업)"], "a": 0, "why": null, "e": "플리퍼 렌즈(±2.00 D)를 번갈아 대며 시표를 선명하게 맞추는 속도를 측정하여 조절의 용이성(facility)을 평가한다. 단안·양안으로 시행한다.", "th": "양안 검사에서 마이너스(또는 플러스) 쪽만 느리면 PRA/NRA, 융합 버전스 문제와 연관해 분석.", "cite": "", "area": "응용"}, {"id": "bv-12", "ch": "bv", "part": "p7", "tier": "응용", "tag": "[출제기준 추정]", "mt": "age", "q": "35세의 근거리 피로 호소자의 푸시업 조절력이 4.00 D였다. Hofstetter 최소 기대 조절력과 비교한 판단으로 옳은 것은?", "o": ["최소 기대값 2.25 D보다 높아 정상이다.", "판단할 수 없다.", "최소 기대값 4.00 D와 같아 정상이다.", "최소 기대값 6.25 D보다 낮으므로 조절부족을 의심한다.", "평균값 8.0 D보다 높아 조절과다이다."], "a": 3, "why": null, "e": "Hofstetter 최소 조절력 = 15 − 0.25 × 35 = 15 − 8.75 = 6.25 D. 측정값 4.00 D는 이보다 2 D 이상 낮으므로 조절부족을 의심한다.", "th": "평균 = 18.5 − 0.3 × 35 = 8.0 D, 최대 = 25 − 0.4 × 35 = 11.0 D.", "cite": "", "area": "응용"}, {"id": "bv-13", "ch": "bv", "part": "p7", "tier": "심화", "tag": "[출제기준 추정]", "mt": "phoria", "q": "고정시차(fixation disparity) 검사에서 고정시차를 0으로 만드는 데 필요한 프리즘량을 무엇이라 하는가?", "o": ["AC/A비", "분리사위(dissociated phoria)", "융합 여력", "카파각", "연합사위(associated phoria)"], "a": 4, "why": null, "e": "융합 상태에서 고정시차를 없애는 프리즘량을 연합사위라 하며, 프리즘 처방량 결정에 활용된다. 분리사위는 융합을 깨뜨린 상태(가림·마독스·폰 그레페)에서 측정한 사위이다.", "th": "대표 기구: 미하일리스 카드, 휘이 고정시차 측정기(Wesson card) 등.", "cite": "", "area": "응용"}, {"id": "bv-14", "ch": "bv", "part": "p7", "tier": "기본", "tag": "[출제기준 추정]", "mt": "phoria", "q": "우안 상사위 2 Δ를 양안에 똑같이 나누어 프리즘으로 처방할 때 옳은 것은?", "o": ["우안 1 Δ 기저 하방, 좌안 1 Δ 기저 상방", "우안 2 Δ 기저 상방", "좌안 2 Δ 기저 하방", "우안 1 Δ 기저 상방, 좌안 1 Δ 기저 하방", "양안 1 Δ 기저 내방"], "a": 0, "why": null, "e": "상사위 눈의 상을 위로 올려주려면(눈이 위로 향한 상태 보상) 해당 눈에 기저 하방(BD)을 넣는다. 우안 상사위 = 좌안 하사위이므로 좌안에는 기저 상방(BU)을 넣는다.", "th": "프리즘은 기저 반대 방향(꼭지각 쪽)으로 상을 이동시킨다.", "cite": "", "area": "응용"}, {"id": "bv-15", "ch": "bv", "part": "p7", "tier": "응용", "tag": "[출제기준 추정]", "mt": "phoria", "q": "원거리 사위가 외사위 6 Δ로 측정되어 프리즘으로 일부 보정할 때 넣는 프리즘의 기저 방향은?", "o": ["우안 BU, 좌안 BD", "기저 외방(BO)", "기저 하방(BD)", "기저 내방(BI)", "기저 상방(BU)"], "a": 3, "why": null, "e": "외사위는 눈이 바깥으로 벗어나려는 경향이므로 상을 바깥쪽(이측)으로 옮겨주는 BI 프리즘으로 보정한다. 내사위는 BO.", "th": "BI 프리즘: 상이 이측으로 이동 → 눈이 덜 모여도 됨.", "cite": "", "area": "응용"}, {"id": "cl-01", "ch": "cl", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "vertex", "q": "정점간거리 12 mm에서 −6.00 D 안경을 착용하는 근시안에 처방할 소프트 콘택트렌즈 굴절력으로 가장 적절한 것은? (0.25 D 단위)", "o": ["−6.50 D", "−6.25 D", "−6.00 D", "−5.50 D", "−5.00 D"], "a": 3, "why": null, "e": "F_CL = −6.00/(1 − 0.012 × (−6.00)) = −6.00/1.072 = −5.597 D → 가장 가까운 0.25 D 단위인 −5.50 D (−5.60에 더 가까움).", "th": "정점간거리 보정 F_c = F/(1 − dF). 근시는 CL 도수가 안경보다 약해진다.", "cite": "", "area": "응용"}, {"id": "cl-02", "ch": "cl", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "vertex", "q": "정점간거리 12 mm에서 +6.00 D 안경을 착용하는 원시안의 콘택트렌즈 굴절력으로 가장 적절한 것은? (0.25 D 단위)", "o": ["+5.50 D", "+5.75 D", "+6.00 D", "+6.50 D", "+7.00 D"], "a": 3, "why": null, "e": "F_CL = 6.00/(1 − 0.012 × 6.00) = 6.00/0.928 = 6.466 D → +6.50 D.", "th": "원시는 CL 도수가 안경보다 강해진다.", "cite": "", "area": "응용"}, {"id": "cl-03", "ch": "cl", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "각막면 굴절이상 −3.00 D(구면), 각막 편평 K 42.75 D인 사람에게 BC를 K보다 0.50 D 스티프한 43.25 D로 RGP 렌즈를 처방할 때 렌즈 굴절력은? (잔여난시 없음 가정)", "o": ["−3.50 D", "−3.25 D", "−3.00 D", "−2.75 D", "−2.50 D"], "a": 0, "why": null, "e": "BC가 각막보다 0.50 D 스티프하면 +0.50 D 눈물렌즈가 생기므로 같은 양의 마이너스를 추가한다(SAM). 렌즈 굴절력 = −3.00 + (−0.50) = −3.50 D.", "th": "SAM-FAP: Steeper Add Minus, Flatter Add Plus. 눈물렌즈 굴절력 = BC(D) − K(D) (각막곡률계 환산 굴절률 기준).", "cite": "", "area": "응용"}, {"id": "cl-04", "ch": "cl", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "각막면 굴절이상 −2.00 D(구면)인 사람에게 BC를 각막 편평 K보다 0.25 D 플랫하게 RGP 렌즈를 처방할 때 렌즈 굴절력은?", "o": ["−2.50 D", "−2.25 D", "−2.00 D", "−1.75 D", "−1.50 D"], "a": 3, "why": null, "e": "BC가 플랫하면 −0.25 D 눈물렌즈가 생기므로 플러스를 추가한다(FAP): −2.00 + 0.25 = −1.75 D.", "th": "FAP: Flatter Add Plus.", "cite": "", "area": "응용"}, {"id": "cl-05", "ch": "cl", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "각막곡률 K: 43.00 D @180, 44.50 D @90이고, 각막면 전체 굴절검사 결과가 S −2.00 D ◯ C −0.50 D Ax 180이다. 구면 RGP 렌즈 착용 시 예상되는 잔여난시는?", "o": ["C −0.50 D Ax 180", "C −2.00 D Ax 90", "C −1.00 D Ax 90", "C −1.50 D Ax 180", "잔여난시 없음"], "a": 2, "why": null, "e": "각막난시 = 44.50 − 43.00 = 1.50 D 직난시 → 교정 C −1.50 Ax 180. 전체 굴절난시 C −0.50 Ax 180. 내부(잔여)난시 = 전체 − 각막 = (−0.50 × 180) − (−1.50 × 180) = +1.00 × 180 = C −1.00 D Ax 90(도난시). 구면 RGP는 각막난시만 상쇄하므로 이 내부난시가 남는다.", "th": "잔여난시 = 굴절난시 − 각막난시(같은 축 표기로 맞춰 계산). 잔여난시가 크면 전면 토릭 RGP·토릭 소프트 고려.", "cite": "", "area": "응용"}, {"id": "cl-06", "ch": "cl", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "Holden과 Mertz가 제시한 각막 부종 방지 기준으로, 연속(밤샘) 착용 시 필요한 최소 산소전달률(Dk/t)은?", "o": ["50 × 10⁻⁹", "125 × 10⁻⁹", "24 × 10⁻⁹", "34 × 10⁻⁹", "87 × 10⁻⁹"], "a": 4, "why": null, "e": "Holden-Mertz(1984) 기준: 일상착용 시 Dk/t 24 × 10⁻⁹, 연속착용 시 87 × 10⁻⁹ 이상이면 각막 부종을 허용 범위로 유지할 수 있다.", "th": "Dk = 재질 고유 산소투과성, Dk/t = 두께를 고려한 산소전달률. 단위 (cm/s)(mL O₂/mL·mmHg).", "cite": "", "area": "응용"}, {"id": "cl-07", "ch": "cl", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "하이드로겔 렌즈와 실리콘하이드로겔 렌즈의 산소투과성(Dk)과 함수율의 관계로 옳은 것은?", "o": ["하이드로겔은 함수율이 높을수록 Dk가 감소한다.", "하이드로겔은 함수율이 높을수록 Dk가 증가하고, 실리콘하이드로겔은 함수율이 낮을수록 Dk가 높은 경향이 있다.", "두 재질 모두 함수율과 Dk는 무관하다.", "실리콘하이드로겔은 물을 통해서만 산소를 전달한다.", "두 재질 모두 함수율이 높을수록 Dk가 감소한다."], "a": 1, "why": null, "e": "하이드로겔은 물을 통해 산소가 전달되므로 함수율이 높을수록 Dk가 증가한다. 실리콘하이드로겔은 실리콘 성분이 산소를 운반하므로 실리콘 비율이 높아(함수율 낮을수록) Dk가 높은 경향이 있다.", "th": "실리콘하이드로겔은 상대적으로 모듈러스가 높고 지질 침착이 잘 생길 수 있다.", "cite": "", "area": "응용"}, {"id": "cl-08", "ch": "cl", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "소프트 콘택트렌즈의 스티프 피팅 징후로 옳은 것은?", "o": ["렌즈 움직임이 거의 없고, 순목 직후 일시적으로 시력이 선명해지며, 렌즈 가장자리 결막 압박 자국이 생긴다.", "렌즈가 쉽게 빠진다.", "순목 시 렌즈가 과도하게 움직인다.", "렌즈 가장자리가 들뜬다.", "순목 직후 시력이 흐려진다."], "a": 0, "why": null, "e": "스티프(타이트) 피팅은 렌즈가 각막에 밀착되어 움직임이 적고, 순목으로 렌즈가 잠시 눌려 시력이 일시적으로 좋아지며, 결막 압박·충혈이 생긴다. 해결: 더 플랫한 BC(큰 값) 또는 작은 직경.", "th": "플랫 피팅: 과도한 움직임, 가장자리 들뜸, 순목 직후 흐려짐, 렌즈 이탈.", "cite": "", "area": "응용"}, {"id": "cl-09", "ch": "cl", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "소프트 콘택트렌즈가 순목 시 과도하게 움직이고 가장자리가 들뜨는 플랫 피팅일 때의 조치로 옳은 것은?", "o": ["직경을 작게 한다.", "BC를 더 작은 값(스티프)으로 하거나 직경을 크게 한다.", "렌즈 굴절력을 +0.50 D 올린다.", "조치할 필요 없다.", "BC를 더 큰 값(플랫)으로 한다."], "a": 1, "why": null, "e": "플랫 피팅은 새그(sagittal depth)가 부족한 상태이므로 BC를 작게(스티프)하거나 직경을 크게 하여 새그를 늘린다.", "th": "새그 증가 요인: BC 감소(곡률반경 작게), 직경 증가.", "cite": "", "area": "응용"}, {"id": "cl-10", "ch": "cl", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "RGP 렌즈의 플루오레세인 염색 패턴에서 렌즈 중심부에 형광이 고이고(밝은 녹색) 중간주변부는 접촉(어두움)하며 기포가 보일 수 있는 상태는?", "o": ["플랫 피팅", "스티프 피팅", "중심이탈 없는 이상적 피팅", "렌즈 뒤집힘", "정렬(alignment) 피팅"], "a": 1, "why": null, "e": "BC가 각막보다 스티프하면 중심부에 눈물이 고여 형광이 밝고, 중간주변부가 접촉해 어둡게 보인다. 플랫 피팅은 반대로 중심 접촉(어두움)·주변부 고임이다.", "th": "형광 밝음 = 눈물층 두꺼움, 어두움 = 접촉(눈물층 얇음).", "cite": "", "area": "응용"}, {"id": "cl-11", "ch": "cl", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "RGP 렌즈 착용자의 각막 3시와 9시 방향에 점상 착색이 관찰되었다. 주된 원인과 관련된 것으로 가장 적절한 것은?", "o": ["소프트 렌즈 재질의 높은 함수율", "렌즈의 정확한 중심 위치", "렌즈의 높은 Dk/t", "렌즈 가장자리 들림·형태 불량과 불완전 순목으로 인한 국소 건조", "과산화수소의 완전 중화"], "a": 3, "why": null, "e": "3–9시 착색은 RGP 가장자리가 순목 시 눈꺼풀이 해당 부위 눈물막을 고르게 펴는 것을 방해하거나 불완전 순목으로 국소 건조가 생겨 나타난다. 가장자리 들림 조정, 직경·디자인 변경, 순목 훈련, 인공눈물 등으로 관리한다.", "th": "RGP 합병증: 3–9시 착색, 렌즈 유착, 각막 변형(warpage), 눈꺼풀처짐.", "cite": "", "area": "응용"}, {"id": "cl-12", "ch": "cl", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "처방 축이 90°인 토릭 소프트 렌즈를 착용시켰더니 렌즈 표시(마크)가 검사자가 볼 때 왼쪽(시계 방향)으로 10° 회전되어 안정되었다. LARS 법칙에 따라 주문할 렌즈 축은?", "o": ["80°", "90°", "100°", "110°", "180°"], "a": 2, "why": null, "e": "LARS(Left Add, Right Subtract): 검사자 기준 왼쪽(시계 방향) 회전이면 회전량을 축에 더한다 → 90° + 10° = 100°.", "th": "반대로 오른쪽(반시계) 회전이면 빼준다. 회전이 일정(안정)해야 보정이 의미가 있다.", "cite": "", "area": "응용"}, {"id": "cl-13", "ch": "cl", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "age", "q": "노안 교정용 모노비전(monovision) 콘택트렌즈 처방의 일반 원칙은?", "o": ["비우세안을 가린다.", "우세안은 원거리용, 비우세안은 근거리용으로 교정한다.", "양안 모두 근거리용으로 교정한다.", "우세안은 근거리용, 비우세안은 원거리용으로 교정한다.", "양안 모두 원거리용으로 교정하고 가입도를 넣지 않는다."], "a": 1, "why": null, "e": "모노비전은 원거리 시력과 운전 등의 안전을 위해 대개 우세안을 원거리, 비우세안을 근거리로 교정한다. 입체시가 다소 감소할 수 있음을 설명해야 한다.", "th": "변형 모노비전: 한 눈 단초점 원용 + 다른 눈 멀티포컬 등.", "cite": "", "area": "응용"}, {"id": "cl-14", "ch": "cl", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "콘택트렌즈 착용에 의한 만성 저산소증의 징후가 아닌 것은?", "o": ["각막 내피 다형성 증가", "각막 실질 부종에 의한 줄무늬(striae)", "각막 미세낭포", "윤부 신생혈관", "거대유두결막염"], "a": 4, "why": null, "e": "미세낭포, 각막 부종·줄무늬, 신생혈관, 내피세포 다형성 등은 저산소와 관련된 변화이다. 거대유두결막염은 침착물에 대한 면역·기계적 반응으로 저산소 징후가 아니다.", "th": "저산소 해결: 높은 Dk/t 재질(실리콘하이드로겔), 착용시간 감축, 연속착용 중단.", "cite": "", "area": "응용"}, {"id": "cl-15", "ch": "cl", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "과산화수소 소독 시스템의 사용 시 반드시 지켜야 할 사항은?", "o": ["착용 전 중화(촉매 디스크 또는 중화정)를 완전히 해야 한다.", "수돗물로 헹군 후 착용한다.", "중화 없이 바로 착용해도 된다.", "다목적용액과 섞어서 사용한다.", "케이스를 바꾸지 않고 계속 사용한다."], "a": 0, "why": null, "e": "과산화수소는 강력한 소독제지만 중화하지 않고 착용하면 심한 통증과 각막 손상이 생긴다. 지정 케이스와 중화 과정(보통 6시간 이상)을 지켜야 한다.", "th": "다목적용액(MPS): 세척·헹굼·소독·보존 겸용, 문질러 세척(rub) 권장.", "cite": "", "area": "응용"}, {"id": "cl-16", "ch": "cl", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "오르토케라톨로지(역기하 렌즈)의 근시 감소 원리로 옳은 것은?", "o": ["수정체를 얇게 한다.", "각막 중심부를 더 볼록하게 만든다.", "안축장을 영구적으로 줄인다.", "조절을 마비시켜 근시를 줄인다.", "수면 중 착용하여 각막 중심부를 편평하게 만들어 일시적으로 근시를 줄인다."], "a": 4, "why": null, "e": "역기하 렌즈는 중심부가 각막보다 플랫하고 그 주변(역커브)이 스티프한 구조로, 각막 상피를 재분포시켜 중심부를 편평하게 해 근시를 일시적으로 줄인다. 착용을 중단하면 원래대로 돌아온다.", "th": "소아 근시 진행 억제 목적으로 사용되기도 하며, 미생물 각막염 예방을 위한 위생 교육이 중요하다.", "cite": "", "area": "응용"}, {"id": "cl-17", "ch": "cl", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "원추각막 환자에게 RGP 렌즈를 처방할 때 흔히 목표로 하는 피팅 형태는?", "o": ["완전 중심 고임", "렌즈 움직임이 전혀 없는 밀착", "주변부만 접촉하는 강한 스티프 피팅", "중심부만 강하게 누르는 플랫 피팅", "3점 접촉(three-point touch)"], "a": 4, "why": null, "e": "원추각막 RGP는 원뿔 정점에 가벼운 접촉과 중간주변부 두 곳의 접촉을 분산시키는 3점 접촉 피팅을 목표로 하여 정점 부담을 줄이고 렌즈 안정성을 확보한다.", "th": "진행된 원추각막: 원추각막용 디자인, 피기백, 하이브리드, 공막렌즈 고려.", "cite": "", "area": "응용"}, {"id": "cl-18", "ch": "cl", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "같은 BC의 소프트 콘택트렌즈에서 직경만 크게 했을 때 피팅 변화로 옳은 것은?", "o": ["피팅에는 변화가 없다.", "새그가 작아져 더 플랫한 피팅이 된다.", "렌즈 굴절력이 크게 증가한다.", "새그가 커져 더 스티프한 피팅이 된다.", "산소전달률이 증가한다."], "a": 3, "why": null, "e": "곡률반경이 같아도 직경이 커지면 렌즈의 시상깊이(새그)가 증가하여 각막·결막에 더 타이트하게 앉는다(스티프 효과).", "th": "구면 새그 s = r − √(r² − (D/2)²). D 증가 → s 증가.", "cite": "", "area": "응용"}, {"id": "inst-01", "ch": "inst", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "선상 검영기로 검사할 때 반사광이 검영기 이동 방향과 반대로 움직이는 '역행'이 관찰되었다. 다음 조치로 옳은 것은?", "o": ["플러스 렌즈를 추가하여 중화한다.", "작업거리를 무한대로 늘린다.", "원주렌즈 축을 90° 돌린다.", "마이너스 렌즈를 추가하여 중화한다.", "검사를 종료하고 굴절이상 없음으로 기록한다."], "a": 3, "why": null, "e": "역행은 원점이 검사자와 피검자 사이에 있음(작업거리 기준 근시)을 뜻하므로 마이너스 렌즈를 추가한다. 동행이면 플러스를 추가한다.", "th": "중화점에서는 동공 전체가 밝아지거나 이동 방향을 판단할 수 없게 된다.", "cite": "", "area": "응용"}, {"id": "inst-02", "ch": "inst", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "자동굴절검사기(autorefractor)에 대한 설명으로 옳은 것은?", "o": ["각막 곡률만 측정한다.", "결과를 그대로 최종 처방으로 사용해야 한다.", "조절마비제를 반드시 점안해야 한다.", "적외선을 이용하며, 기계근시로 근시가 과대 측정될 수 있어 운무 시표를 사용한다.", "자외선을 이용한다."], "a": 3, "why": null, "e": "자동굴절검사기는 적외선을 이용한 타각적 검사로, 기기를 들여다볼 때 조절이 유발되는 기계근시를 줄이기 위해 운무 시표를 사용한다. 결과는 자각적 굴절검사의 출발점이다.", "th": "안경사는 약제를 사용하지 않는 자동굴절검사기기 검사를 할 수 있다(시행령 별표 1).", "cite": "", "area": "응용"}, {"id": "inst-03", "ch": "inst", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "각막곡률계에서 측정한 곡률반경이 7.50 mm일 때 각막 굴절력은? (환산 굴절률 1.3375)", "o": ["42.00 D", "43.50 D", "45.00 D", "46.50 D", "50.13 D"], "a": 2, "why": null, "e": "K = (1.3375 − 1)/r = 0.3375/0.00750 m = 45.00 D (또는 337.5/7.50).", "th": "환산 굴절률 1.3375는 각막 후면의 마이너스 굴절력을 근사적으로 반영한 값이다.", "cite": "", "area": "응용"}, {"id": "inst-04", "ch": "inst", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "각막곡률계에 이중상(doubling) 원리를 이용하는 주된 이유는?", "o": ["측정 범위를 각막 주변부까지 넓히기 위해", "측정 중 안구의 미세한 움직임이 있어도 두 상이 함께 움직여 측정이 가능하도록 하기 위해", "색수차를 없애기 위해", "편광을 만들기 위해", "배율을 높이기 위해"], "a": 1, "why": null, "e": "각막 반사상의 크기로 곡률을 구하는데, 상이 계속 움직이면 크기 측정이 어렵다. 이중상을 만들어 두 상의 위치 관계를 맞추면 안구가 움직여도 두 상이 함께 움직이므로 정확히 측정할 수 있다.", "th": "헬름홀츠형: 물체(마이어) 크기 고정·이중상 가변 / 자발-쉬외츠형: 이중상 고정·물체 크기 가변.", "cite": "", "area": "응용"}, {"id": "inst-05", "ch": "inst", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "포롭터 보조렌즈 중 'RMH'의 의미와 용도로 옳은 것은?", "o": ["우안 편광렌즈 — 입체시 측정", "우안 검영 렌즈 +1.50 D", "우안 핀홀 — 굴절이상 확인", "우안 적색 마독스로드(막대 수평) — 수직선을 만들어 수평 사위 측정", "우안 적색 마독스로드(막대 수직) — 수평선을 만들어 수평 사위 측정"], "a": 3, "why": null, "e": "RMH = Right, red Maddox rod, Horizontal. 막대가 수평이면 보이는 선은 수직이 되어 수평 방향 편위(내·외사위)를 측정한다. RMV는 수평선을 만들어 수직 사위를 측정한다.", "th": "마독스로드: 막대 방향 ⟂ 보이는 선 방향.", "cite": "", "area": "응용"}, {"id": "inst-06", "ch": "inst", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "렌즈미터(lensmeter)가 측정하는 렌즈 굴절력은?", "o": ["등가굴절력(equivalent power)", "전면 면굴절력", "후면정점굴절력(back vertex power)", "공칭굴절력", "주점굴절력"], "a": 2, "why": null, "e": "렌즈의 후면을 렌즈 받침에 대면 렌즈 후면 정점이 표준렌즈의 초점 위치에 오며(바달 원리), 이때 측정되는 값은 후면정점굴절력이다. 안경 처방도 후면정점굴절력으로 표시한다.", "th": "다초점 가입도 측정은 전면을 받침에 대고 전면정점굴절력 차이로 구한다.", "cite": "", "area": "응용"}, {"id": "inst-07", "ch": "inst", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "굴절률 1.53 기준으로 보정된 구면계(렌즈 클락)로 CR-39(n = 1.498) 렌즈 표면을 측정하여 +6.00 D를 읽었다. 실제 면굴절력으로 가장 가까운 것은?", "o": ["+5.25 D", "+5.64 D", "+6.00 D", "+6.38 D", "+6.53 D"], "a": 1, "why": null, "e": "구면계는 새그로 곡률을 읽고 n = 1.53으로 환산하여 표시한다. 실제 면굴절력 = 눈금 × (n − 1)/(1.53 − 1) = 6.00 × 0.498/0.53 = 5.64 D.", "th": "면굴절력 F = (n − 1)/r → 같은 곡률이면 굴절률에 비례해 환산.", "cite": "", "area": "응용"}, {"id": "inst-08", "ch": "inst", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "세극등현미경 조명법 중 각막 내피세포를 관찰하는 데 주로 사용하는 방법은?", "o": ["공막산란법", "간접조명법", "확산조명법", "경면반사법", "후방조명법"], "a": 3, "why": null, "e": "경면반사법은 조명축과 관찰축을 입사각=반사각이 되도록 배치하여 각막 내피의 반사면을 관찰한다. 공막산란법은 각막의 미세 혼탁·부종, 후방조명은 각막 미세낭포·혈관 등 관찰에 유용하다.", "th": "CL 피팅 평가에는 플루오레세인 염색 + 코발트블루 필터(+ 황색 관찰 필터)를 사용.", "cite": "", "area": "응용"}, {"id": "inst-09", "ch": "inst", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "표준 안압 측정법으로 사용되며, 각막 중앙의 일정 면적(직경 3.06 mm)을 편평하게 하는 데 필요한 힘으로 안압을 측정하는 기기는?", "o": ["비접촉 공기분사 안압계", "각막곡률계", "골드만 압평 안압계", "검안경", "쇼츠 압입 안압계"], "a": 2, "why": null, "e": "골드만 압평 안압계는 직경 3.06 mm 면적을 편평하게 하는 힘을 측정하며 표준법으로 쓰인다. 비접촉 안압계는 공기분사로 각막을 편평하게 하여 측정한다.", "th": "각막 두께가 두꺼우면 안압이 높게, 얇으면 낮게 측정되는 경향이 있다.", "cite": "", "area": "응용"}, {"id": "inst-10", "ch": "inst", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "직상검안경과 간접검안경의 비교로 옳은 것은?", "o": ["직상검안경은 도립상이다.", "직상검안경은 정립상·높은 배율(약 15배)·좁은 시야, 간접검안경은 도립상·낮은 배율·넓은 시야이다.", "간접검안경의 시야가 더 좁다.", "두 기기 모두 정립상이다.", "간접검안경은 배율이 15배 이상이다."], "a": 1, "why": null, "e": "직상검안경은 눈의 광학계를 확대경처럼 이용해 정립상을 약 15배로 보며 시야가 좁다. 간접검안경은 집광렌즈(+20 D 등)로 도립 실상을 만들어 넓은 시야를 관찰한다.", "th": "직상검안경 배율 ≈ 눈 굴절력/4 = 60/4 = 15배.", "cite": "", "area": "응용"}, {"id": "inst-11", "ch": "inst", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "렌즈 내부의 응력(변형)이나 열처리·강화 상태를 확인하는 데 사용하는 기기의 원리는?", "o": ["렌즈 두께를 측정한다.", "자외선 투과율을 측정한다.", "두 편광판 사이에서 응력에 의한 복굴절 무늬를 관찰한다.", "렌즈의 반사율을 측정한다.", "렌즈의 아베수를 측정한다."], "a": 2, "why": null, "e": "왜곡(응력)검사기는 교차된 편광판 사이에 렌즈를 두어 내부 응력에 의한 복굴절이 만드는 무늬를 관찰한다. 렌즈를 테에 너무 꽉 끼운 경우에도 응력 무늬가 보인다.", "th": "물리광학의 복굴절·편광 원리 응용.", "cite": "", "area": "응용"}, {"id": "inst-12", "ch": "inst", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "age", "q": "근점과 폭주근점(NPC)을 측정하는 데 흔히 사용하는 도구는?", "o": ["렌즈미터", "안압계", "구면계", "각막곡률계", "근점자(RAF rule 등)"], "a": 4, "why": null, "e": "RAF 근점자는 눈금 막대에 시표를 달아 시표를 눈 쪽으로 다가오게 하면서 흐려지는 점(조절 근점)이나 복시가 생기는 점(폭주근점)을 측정한다.", "th": "푸시업 조절력 = 1/근점거리(m). 폭주근점은 보통 약 6~10 cm 이내를 정상으로 본다(기준은 문헌마다 다름).", "cite": "", "area": "응용"}, {"id": "inst-13", "ch": "inst", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "unit", "q": "포롭터에서 'R' 보조렌즈(검영용 렌즈)의 일반적인 굴절력과 그에 해당하는 작업거리는?", "o": ["+2.00 D — 약 40 cm", "+0.50 D — 약 2 m", "−1.50 D — 약 67 cm", "+1.00 D — 약 50 cm", "+1.50 D — 약 67 cm"], "a": 4, "why": null, "e": "R 렌즈는 보통 +1.50 D로, 작업거리 67 cm(1/0.67 ≈ 1.50 D)에서 검영 시 작업거리 보정을 대신한다. R 렌즈를 넣은 상태에서 중화된 값이 곧 원용 굴절이상이다.", "th": "작업거리 50 cm면 +2.00 D 보정이 필요.", "cite": "", "area": "응용"}, {"id": "inst-14", "ch": "inst", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "정적 자동 시야계(예: 험프리)의 검사 원리로 옳은 것은?", "o": ["안구 길이를 측정한다.", "고정된 위치에서 자극의 밝기를 변화시켜 각 지점의 역치를 측정한다.", "자극을 주변에서 중심으로 움직여 등감도선을 그린다.", "각막 두께를 측정한다.", "망막 단층을 촬영한다."], "a": 1, "why": null, "e": "정적 시야검사는 위치를 고정하고 밝기를 바꾸어 각 점의 광감도 역치를 측정한다. 골드만 시야계 같은 동적 검사는 자극을 움직여 등감도선(isopter)을 그린다.", "th": "녹내장 시야 평가에 정적 자동 시야계를 많이 사용.", "cite": "", "area": "응용"}, {"id": "inst-15", "ch": "inst", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "동공간거리계(PD 측정기)의 측정 원리로 옳은 것은?", "o": ["피검자가 기기 내 시표를 주시할 때 생기는 각막반사의 위치를 기준으로 측정한다.", "망막 혈관 간격을 측정한다.", "안압 차이를 이용한다.", "동공 크기를 측정한다.", "렌즈의 광학중심을 측정한다."], "a": 0, "why": null, "e": "PD 측정기는 내부 광원의 각막반사(대략 시축 근처)를 맞추어 단안·양안 PD를 측정하며, 주시 거리를 원거리·근거리로 바꿀 수 있다.", "th": "누진렌즈 조제에는 단안 PD 측정이 필수.", "cite": "", "area": "응용"}, {"id": "prac-01", "ch": "prac", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "age", "q": "자각적 굴절검사의 구면 정밀검사에서 가장 기본이 되는 원칙인 MPMVA의 의미는?", "o": ["최고 시력을 얻을 수 있는 가장 플러스(최소 마이너스) 굴절력", "운무량을 최대로 하는 굴절력", "최고 시력을 얻을 수 있는 가장 마이너스 굴절력", "등가구면이 0이 되는 굴절력", "근점이 가장 가까워지는 굴절력"], "a": 0, "why": null, "e": "Maximum Plus to Maximum Visual Acuity: 같은 최고 시력이 나오는 렌즈 중 가장 플러스 쪽을 선택하여 근시 과교정(조절 유발)을 막는다.", "th": "−0.25 D 추가 시 시력 향상이 없으면 추가하지 않는다.", "cite": "", "area": "실기"}, {"id": "prac-02", "ch": "prac", "part": "p6", "tier": "응용", "tag": "[기출 확인]", "mt": "concept", "q": "운무 상태에서 방사선시표를 보게 했더니 4시–10시 방향의 선이 가장 선명하다고 응답했다. 교정 (−)원주렌즈의 축은?", "o": ["30°", "60°", "100°", "120°", "150°"], "a": 3, "why": null, "e": "가장 선명한 선의 작은 시계 숫자 4 × 30 = 120°.", "th": "30배 법칙(국시원 예시문항 2와 같은 원리).", "cite": "", "area": "실기"}, {"id": "prac-03", "ch": "prac", "part": "p6", "tier": "심화", "tag": "[기출 확인]", "mt": "base", "q": "처방 O.D. S −4.00 D ◯ C −1.00 D Ax 180, 2.0 Δ B.O., 측정 단안 P.D. 32 mm일 때 렌즈 조제가공 단안 P.D.는?", "o": ["26.4 mm", "27 mm", "30 mm", "34 mm", "37 mm"], "a": 1, "why": null, "e": "수평 프리즘이므로 180° 경선 굴절력 사용: 원주 축이 180°이므로 180° 경선 = S = −4.00 D. c = 2.0/4.00 = 0.5 cm = 5 mm. 마이너스 렌즈에서 BO를 얻으려면 광학중심을 기저 반대쪽(비측)으로 이동 → 32 − 5 = 27 mm.", "th": "원주 축 방향 경선의 굴절력 = 구면값, 축과 수직 경선 = S + C. (원주 축 90°였다면 180° 경선은 S + C)", "cite": "", "area": "실기"}, {"id": "prac-04", "ch": "prac", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "소프트 콘택트렌즈 피팅 평가에서 아래눈꺼풀로 렌즈 하단을 밀어 올려 렌즈의 움직임과 복귀 속도로 밀착 정도를 평가하는 방법은?", "o": ["적록검사", "TBUT 검사", "푸시업 검사(push-up test)", "커버-언커버 검사", "가림검사"], "a": 2, "why": null, "e": "푸시업 검사는 렌즈를 손가락(아래눈꺼풀)으로 밀어 올렸을 때 쉽게 움직이고 부드럽게 제자리로 돌아오는지 보아 타이트(스티프)·루즈(플랫)를 판단한다.", "th": "정적 평가(중심 위치·각막 덮임) + 동적 평가(순목 시 움직임·푸시업).", "cite": "", "area": "실기"}, {"id": "prac-05", "ch": "prac", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "concept", "q": "고도 원시(+5.00 D) RGP 렌즈가 지속적으로 아래로 처져 하방 중심이탈된다. 개선 방법으로 가장 적절한 것은?", "o": ["렌즈 중심두께를 더 두껍게 한다.", "가장자리에 마이너스 캐리어(렌티큘러) 디자인을 적용해 위눈꺼풀이 렌즈를 잡아 올리게 하고 두께·무게를 줄이며, 필요하면 직경을 조정한다.", "모든 경우 소프트 렌즈로만 교체해야 한다.", "BC를 더 플랫하게 한다.", "직경을 크게 줄이고 두께를 늘린다."], "a": 1, "why": null, "e": "플러스 렌즈는 중심이 두꺼워 무게중심이 앞쪽·아래로 쏠려 처지기 쉽다. 마이너스 캐리어 렌티큘러 디자인은 위눈꺼풀이 렌즈 가장자리를 잡아 올리게 하고, 두께를 줄여 무게를 감소시킨다. 적절한 BC·직경 조정도 함께 검토한다.", "th": "하방 중심이탈 원인: 렌즈 무게, 플랫 피팅, 위눈꺼풀 장력 부족 등.", "cite": "", "area": "실기"}, {"id": "prac-06", "ch": "prac", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "age", "q": "55세, 원용 정시, 근거리 작업거리 40 cm인 고객에게 Hofstetter 평균 조절력과 '조절력의 1/2 예비' 원칙을 적용한 예상 가입도는?", "o": ["+0.75 D", "+1.00 D", "+1.50 D", "+2.00 D", "+2.50 D"], "a": 2, "why": null, "e": "평균 조절력 = 18.5 − 0.3 × 55 = 2.00 D, 사용 가능 = 1.00 D. Add = 1/0.40 − 1.00 = 2.50 − 1.00 = +1.50 D.", "th": "예상 가입도는 출발점일 뿐, FCC·NRA/PRA·시험테 확인으로 결정한다.", "cite": "", "area": "실기"}, {"id": "prac-07", "ch": "prac", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "age", "q": "원용 처방 S −1.00 D인 사람의 가입도가 +2.00 D일 때 근용 단초점 안경의 굴절력은?", "o": ["S −3.00 D", "S −1.00 D", "S +1.00 D", "S +2.00 D", "S +3.00 D"], "a": 2, "why": null, "e": "근용 굴절력 = 원용 굴절력 + 가입도 = −1.00 + 2.00 = +1.00 D.", "th": "원주가 있으면 원주·축은 그대로 두고 구면에만 가입도를 더한다.", "cite": "", "area": "실기"}, {"id": "prac-08", "ch": "prac", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "멀티포컬(동시시형) 콘택트렌즈의 원리에 대한 설명으로 옳은 것은?", "o": ["한 눈은 원용, 다른 눈은 근용으로 교정한다.", "핀홀 효과만 이용한다.", "동공 영역 안에 원용·근용 굴절력이 동시에 존재하여, 뇌가 필요한 상을 선택적으로 인지한다.", "조절을 회복시킨다.", "눈동자가 아래로 움직일 때만 근용부를 사용한다."], "a": 2, "why": null, "e": "동시시 렌즈는 동심원·비구면 구조로 원·근 상이 동시에 망막에 맺히고, 뇌가 선명한 상을 선택한다. 대비감도 저하·야간 빛번짐이 있을 수 있다.", "th": "교대시(translating) 렌즈: 시선 이동에 따라 원용부/근용부 사용(RGP 이중초점 등). 모노비전: 양안에 다른 초점.", "cite": "", "area": "실기"}, {"id": "prac-09", "ch": "prac", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "CL 착용자가 한쪽 눈의 심한 통증, 충혈, 눈부심, 시력저하를 호소하며 방문했다. 안경사의 가장 적절한 조치는?", "o": ["렌즈 도수를 낮춘다.", "즉시 렌즈 착용을 중단시키고 안과 진료를 권유한다.", "새 렌즈로 교체해 계속 착용하게 한다.", "인공눈물을 넣고 렌즈를 재착용하게 한다.", "항생제 안약을 판매하여 점안하게 한다."], "a": 1, "why": null, "e": "미생물 각막염 등 응급 질환 가능성이 있으므로 즉시 착용을 중단하고 렌즈·케이스를 보관해 지참하도록 하며 안과 진료를 권한다. 약제 사용·처방은 안경사 업무가 아니다.", "th": "착용자 교육·고지의무: 사용방법, 유통기한, 부작용 정보 제공(의료기사법 제12조⑦).", "cite": "", "area": "실기"}, {"id": "prac-10", "ch": "prac", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "안경을 착용시켜 정면에서 보니 우측 렌즈가 좌측보다 높게 위치한다. 좌우 높이를 맞추는 템플 조정으로 옳은 것은?", "o": ["좌측 템플을 위로 굽힌다.", "코받침 간격만 넓힌다.", "우측 템플을 아래로 굽힌다.", "우측 템플을 위로 굽히거나(경사 증가) 좌측 템플을 아래로 굽힌다.", "양쪽 템플을 바깥으로 벌린다."], "a": 3, "why": null, "e": "템플을 위로 굽히면 그쪽 프런트가 내려가고, 아래로 굽히면 올라간다. 우측이 높으므로 우측 템플을 위로 굽히거나 좌측 템플을 아래로 굽힌다. 귀 높이 차이도 확인한다.", "th": "'높은 쪽 템플은 올리고, 낮은 쪽 템플은 내린다.'", "cite": "", "area": "실기"}, {"id": "prac-11", "ch": "prac", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "age", "q": "누진굴절력렌즈를 처방할 때 양안 PD 대신 단안 PD를 측정하는 가장 중요한 이유는?", "o": ["렌즈 두께를 줄이기 위해", "가입도를 계산하기 위해", "법령에서 요구하기 때문에", "얼굴과 콧대가 좌우 비대칭인 경우가 많아 좁은 누진대를 각 눈의 시선에 정확히 맞추기 위해", "단안 PD가 항상 더 크기 때문에"], "a": 3, "why": null, "e": "누진대는 폭이 좁아 수평 위치가 1~2 mm만 어긋나도 중간·근거리 시야가 좁아진다. 따라서 각 눈의 동공 중심을 기준으로 한 단안 PD와 피팅 높이를 사용한다.", "th": "근거리 주시 시 수렴에 따른 근용부 내측 이동(인셋)은 렌즈 설계에 반영되어 있다.", "cite": "", "area": "실기"}, {"id": "prac-12", "ch": "prac", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "소프트 콘택트렌즈가 스티프하게 피팅되었을 때 BC 변경으로 옳은 것은?", "o": ["BC는 변경하지 않고 착용시간만 늘린다.", "BC 값을 더 크게(예: 8.4 mm → 8.7 mm) 하여 플랫하게 한다.", "BC 값을 더 작게(예: 8.7 mm → 8.4 mm) 한다.", "직경을 크게 한다.", "굴절력을 높인다."], "a": 1, "why": null, "e": "스티프 피팅은 새그가 과도한 상태이므로 곡률반경을 크게(플랫)하거나 직경을 작게 하여 새그를 줄인다.", "th": "곡률반경 r ↑ → 새그 ↓ → 플랫.", "cite": "", "area": "실기"}, {"id": "prac-13", "ch": "prac", "part": "p6", "tier": "응용", "tag": "[출제기준 추정]", "mt": "concept", "q": "RGP 렌즈의 플루오레세인 패턴에서 렌즈 중심부가 어둡게(각막과 접촉) 보이고 주변부에 넓은 형광 고임이 있다. 피팅 상태와 조치는?", "o": ["플랫 피팅 — BC를 작은 값(스티프)으로 바꾼다.", "정렬 피팅 — 변경 불필요", "렌즈 뒤집힘 — 다시 끼운다.", "스티프 피팅 — BC를 큰 값으로 바꾼다.", "스티프 피팅 — 직경을 크게 한다."], "a": 0, "why": null, "e": "중심 접촉·주변 고임은 BC가 각막보다 플랫한 상태이다. BC를 스티프하게(곡률반경 작게) 바꾸면 SAM 원칙에 따라 렌즈 굴절력도 마이너스 쪽으로 조정해야 한다.", "th": "BC 0.05 mm 변경 ≈ 0.25 D 눈물렌즈 변화(K 7.8 mm 부근 근사).", "cite": "", "area": "실기"}, {"id": "prac-14", "ch": "prac", "part": "p6", "tier": "기본", "tag": "[출제기준 추정]", "mt": "base", "q": "우안 상사위 3 Δ가 있는 고객이 장시간 독서 시 불편을 호소하여 수직 프리즘을 처방하려 한다. 가장 적절한 처방 방법은?", "o": ["수직 사위는 프리즘으로 교정할 수 없다.", "필요량을 양안에 나누어 우안 기저 하방, 좌안 기저 상방으로 넣는다.", "좌안에 기저 하방만 넣는다.", "양안 모두 기저 내방으로 넣는다.", "우안에 기저 상방만 넣는다."], "a": 1, "why": null, "e": "우안 상사위는 우안 BD 또는 좌안 BU로 보정하며, 렌즈 두께·무게 균형을 위해 양안에 나누어(예: 우안 1.5 Δ BD, 좌안 1.5 Δ BU) 처방하는 것이 일반적이다. 처방량은 고정시차·연합사위 등으로 결정한다.", "th": "수직 프리즘은 보통 측정량 전체 또는 연합사위량을 기준으로 처방.", "cite": "", "area": "실기"}, {"id": "prac-15", "ch": "prac", "part": "p6", "tier": "심화", "tag": "[출제기준 추정]", "mt": "age", "q": "이중초점 안경의 가입도를 렌즈미터로 측정하였다. 원용부 전면정점굴절력 −1.25 D, 근용부(분절) 전면정점굴절력 +0.75 D였다. 가입도는?", "o": ["+0.50 D", "+0.75 D", "+1.25 D", "+2.00 D", "+2.50 D"], "a": 3, "why": null, "e": "가입도 = 근용부 전면정점굴절력 − 원용부 전면정점굴절력 = +0.75 − (−1.25) = +2.00 D.", "th": "분절이 전면에 있으므로 전면을 렌즈 받침에 대고 측정(전면정점굴절력).", "cite": "", "area": "실기"}, {"id": "prac-16", "ch": "prac", "part": "p6", "tier": "응용", "tag": "[기출 확인]", "mt": "concept", "q": "고객이 운전용 선글라스를 원하며 수면·도로 반사광 눈부심을 줄이고 싶어 한다. 상품 선택 조언으로 가장 적절한 것은?", "o": ["투명 렌즈에 반사방지 코팅만 권한다.", "적외선 투과 렌즈를 권한다.", "가시광선 투과율 3 % 이하의 가장 진한 렌즈를 야간 운전용으로 권한다.", "편광렌즈를 권하고, LCD 화면·일부 앞유리 장식은 편광 각도에 따라 어둡게 보일 수 있음을 설명한다.", "프레넬 렌즈를 권한다."], "a": 3, "why": null, "e": "편광렌즈는 반사광의 수평 편광 성분을 차단해 눈부심을 줄인다. 다만 편광된 화면(LCD)이 각도에 따라 어둡게 보일 수 있다. 매우 진한 렌즈는 야간·터널 운전에 부적합하다.", "th": "물리광학 — 브루스터각·말루스 법칙. 국시원 예시문항 4 참고.", "cite": "", "area": "실기"}, {"id": "neye-01", "ch": "eye", "part": "eye", "tier": "기본", "tag": "[출제기준 추정]", "mt": "symptom", "q": "68세 손님이 1~2년 사이 서서히 흐려지고 밤에 불빛이 번진다고 한다. 최근에는 돋보기 없이도 신문이 더 잘 보인다고 한다. 가장 의심되는 것은?", "o": ["핵백내장", "급성폐쇄각녹내장", "망막박리", "세균결막염", "원추각막"], "a": 0, "why": ["핵백내장은 수정체 굴절률이 올라 근시 쪽으로 이동해 근거리가 일시적으로 잘 보일 수 있어요(second sight).", "급성폐쇄각녹내장은 갑작스러운 통증·구토가 특징이에요.", "망막박리는 번쩍임·날파리·커튼 가림이 갑자기 생겨요.", "결막염은 충혈·분비물이 주 증상이에요.", "원추각막은 주로 젊은 나이에 불규칙 난시로 시작해요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "neye-02", "ch": "eye", "part": "eye", "tier": "기본", "tag": "[출제기준 추정]", "mt": "symptom", "q": "안경 도수를 여러 번 바꿔도 교정시력이 0.6 이상 오르지 않는 72세 손님에게 가장 알맞은 대응은?", "o": ["눈 질환 가능성을 설명하고 안과 진료를 권한다.", "프리즘을 넣어 시력을 올린다.", "조절마비제를 점안한 뒤 다시 검사한다.", "콘택트렌즈로 바꾸면 해결된다고 안내한다.", "시력이 오를 때까지 −도수를 계속 올린다."], "a": 0, "why": ["교정시력이 안 오르면 백내장·황반 질환 등 안질환을 의심하고 의뢰해요.", "프리즘은 시력을 올리는 도구가 아니에요.", "안경사는 약제를 사용하는 검사를 할 수 없어요(시행령 별표 1).", "질환이 원인이면 CL로도 해결되지 않아요.", "과교정은 조절 부담만 늘리고 원인을 놓쳐요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "neye-03", "ch": "eye", "part": "eye", "tier": "기본", "tag": "[출제기준 추정]", "mt": "symptom", "q": "저녁에 어두운 극장에서 나온 뒤 한쪽 눈이 몹시 아프고 두통·구토가 있으며, 불빛 주위에 무지개가 보인다는 손님이 있다. 가장 의심되는 것과 대응은?", "o": ["알레르기결막염 — 인공눈물 안내", "안구건조증 — 다음 주 재방문", "안검염 — 온찜질 안내", "노안 — 근용 안경 처방", "급성폐쇄각녹내장 — 즉시 안과"], "a": 4, "why": ["알레르기는 가려움이 주이고 구토·무지개 달무리는 없어요.", "응급 증상을 미루면 안 돼요.", "안검염은 눈꺼풀 가장자리 염증으로 응급이 아니에요.", "노안은 통증이 없어요.", "어두운 곳에서 동공이 커지며 앞방각이 막혀 안압이 급히 올라요. 시력을 잃을 수 있는 응급이에요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "neye-04", "ch": "eye", "part": "eye", "tier": "기본", "tag": "[출제기준 추정]", "mt": "symptom", "q": "개방각녹내장에 대한 설명으로 옳은 것은?", "o": ["초기부터 심한 눈 통증이 있다.", "수정체가 뿌옇게 되는 병이다.", "초기에는 자각 증상이 거의 없고 주변 시야부터 좁아진다.", "중심 시력이 가장 먼저 떨어진다.", "안압이 정상이면 절대 생기지 않는다."], "a": 2, "why": ["심한 통증은 급성폐쇄각녹내장의 특징이에요.", "수정체 혼탁은 백내장이에요.", "시신경 손상이 천천히 진행해 늦게 알아차려요.", "중심 시력은 말기에야 떨어져요.", "정상안압녹내장도 있어요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "neye-05", "ch": "eye", "part": "eye", "tier": "응용", "tag": "[출제기준 추정]", "mt": "symptom", "q": "녹내장에서 전형적으로 나타나는 시야 결손은?", "o": ["동측 반맹(양눈 같은 쪽)", "중심 암점", "시야 결손 없음", "양이측 반맹", "활 모양 암점과 비측 계단"], "a": 4, "why": ["동측 반맹은 시교차 뒤(시삭·후두엽) 병변이에요.", "중심 암점은 황반·시신경염 등에서 흔해요.", "녹내장은 시야 결손이 핵심 소견이에요.", "양이측 반맹은 시교차 병변(예: 뇌하수체 종양)이에요.", "망막신경섬유 배열을 따라 활 모양·코 쪽 계단 모양으로 생겨요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "neye-06", "ch": "eye", "part": "eye", "tier": "응용", "tag": "[출제기준 추정]", "mt": "symptom", "q": "급성폐쇄각녹내장의 위험이 가장 높은 손님은?", "o": ["고도 근시인 25세 남성", "무수정체안(인공수정체 없음) 50세", "고도 원시인 65세 여성", "정시인 30세 남성", "난시가 있는 10세 아동"], "a": 2, "why": ["고도근시는 앞방이 깊은 편이라 폐쇄각 위험이 낮아요(망막박리 위험은 높음).", "수정체가 없으면 앞방이 깊어져요.", "원시안은 눈이 작고 앞방이 얕아요. 나이가 들며 수정체가 두꺼워져 앞방각이 더 좁아져요.", "특별한 위험 요인이 없어요.", "아동 난시는 폐쇄각과 관련이 적어요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "neye-07", "ch": "eye", "part": "eye", "tier": "기본", "tag": "[출제기준 추정]", "mt": "symptom", "q": "당뇨망막병증에서 '증식성'으로 구분하는 기준이 되는 소견은?", "o": ["망막 신생혈관", "드루젠", "결막 유두", "수정체 혼탁", "각막 부종"], "a": 0, "why": ["허혈로 생긴 신생혈관이 유리체 출혈·견인 망막박리를 일으킬 수 있어요.", "드루젠은 황반변성 소견이에요.", "결막 유두는 알레르기·GPC에서 보여요.", "수정체 혼탁은 백내장이에요.", "각막 부종은 급성녹내장·저산소에서 보여요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "neye-08", "ch": "eye", "part": "eye", "tier": "응용", "tag": "[출제기준 추정]", "mt": "symptom", "q": "혈당 조절이 불안정한 당뇨 손님이 몇 주 사이 도수가 자주 바뀐다고 한다. 가장 알맞은 대응은?", "o": ["프리즘 안경을 권한다.", "그날 측정값으로 바로 고도수 안경을 만든다.", "CL 연속 착용을 권한다.", "조절마비 굴절검사를 직접 한다.", "혈당 변화로 굴절이 변할 수 있음을 설명하고, 안과 검진 후 안정되면 처방한다."], "a": 4, "why": ["도수 변동과 관련이 없어요.", "불안정할 때 맞춘 안경은 곧 맞지 않을 수 있어요.", "당뇨는 각막 감염 위험이 높아 연속 착용이 불리해요.", "약제를 쓰는 검사는 안경사 업무가 아니에요.", "혈당이 수정체 굴절에 영향을 줘요. 망막병증 검진도 필요해요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "neye-09", "ch": "eye", "part": "eye", "tier": "기본", "tag": "[출제기준 추정]", "mt": "symptom", "q": "직선이 휘어 보이고 중심이 흐리다는 70세 손님에게 암슬러 격자로 확인하려는 질환은?", "o": ["황반변성", "결막이완증", "개방각녹내장 초기", "원시", "안검내반"], "a": 0, "why": ["변시증·중심 암점은 황반 질환의 신호예요.", "결막 문제는 직선 왜곡을 만들지 않아요.", "녹내장 초기에는 중심이 아니라 주변이 먼저 손상돼요.", "원시는 직선이 휘어 보이지 않아요.", "속눈썹 찌름은 이물감이 주예요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "neye-10", "ch": "eye", "part": "eye", "tier": "응용", "tag": "[출제기준 추정]", "mt": "symptom", "q": "습성(삼출성) 황반변성의 핵심 소견은?", "o": ["각막 신생혈관", "맥락막 신생혈관", "수정체 탈구", "시신경유두 함몰", "드루젠만 있고 출혈 없음"], "a": 1, "why": ["각막 신생혈관은 CL 저산소 등에서 보여요.", "맥락막 신생혈관에서 출혈·삼출이 생겨 빠르게 시력이 떨어져요.", "수정체 탈구는 다른 질환이에요.", "유두 함몰은 녹내장이에요 00 D 안경의 광학중심 간 거리가 손님 PD보다 6 mm 넓게(한쪽 3 mm씩 바깥) 만들어졌다. 두 눈에 생기는 총 프리즘은?", "o": ["3.6Δ BI", "3.6Δ BO", "36Δ BI", "1.8Δ BI", "1.0Δ BO"], "a": 0, "why": ["한쪽 0.3 × 6 = 1.8Δ, 두 눈 3.6Δ. 시선이 중심의 코 쪽을 지나고 오목렌즈 기저는 반대쪽(코 쪽) → BI.", "볼록렌즈 규칙으로 판단한 방향 실수예요.", "mm 단위를 그대로 곱했어요.", "한쪽 눈 값만 썼어요.", "6 ÷ 6 = 1로 잘못 계산했어요."], "e": "", "th": "", "cite": "", "area": "응용"}, {"id": "nsopt-03", "ch": "sopt", "part": "p5", "tier": "심화", "tag": "[출제기준 추정]", "mt": "base", "q": "오른눈 +1.00 D, 왼눈 +3.50 D 안경으로 광학중심 8 mm 아래를 보며 책을 읽는다. 두 눈 사이 수직 프리즘 차이는?", "o": ["2.8Δ", "2.0Δ", "20Δ", "3.6Δ", "0.8Δ"], "a": 1, "why": ["왼눈 값만 썼어요.", "오른 0.8 × 1 = 0.8Δ, 왼 0.8 × 3.5 = 2.8Δ (둘 다 BU), 차이 2.0Δ.", "mm 단위 실수예요.", "두 값을 더했어요(같은 방향이면 빼야 해요).", "오른눈 값만 썼어요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "nsopt-04", "ch": "sopt", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "vertex", "q": "정점간거리 12 mm에서 −8.00 D 안경을 쓰는 손님의 CL 도수(구면)에 가장 가까운 것은?", "o": ["−9.00 D", "−8.75 D", "−8.00 D", "−7.25 D", "−6.50 D"], "a": 3, "why": ["방향과 크기 모두 틀렸어요.", "원시처럼 강해지는 방향으로 계산했어요(1 − dF 사용).", "정점간거리를 빼먹었어요.", "Fc = −8 ÷ (1 + 0.012 × 8) = −8 ÷ 1.096 ≈ −7.30 → 0.25 D 단위로 −7.25 D. 근시는 CL이 약해져요.", "너무 많이 줄였어요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "nsopt-05", "ch": "sopt", "part": "p5", "tier": "응용", "tag": "[출제기준 추정]", "mt": "vertex", "q": "정점간거리 14 mm에서 +6.00 D 안경을 쓰는 손님의 CL 도수에 가장 가까운 것은?", "o": ["+5.50 D", "+5.75 D", "+6.00 D", "+6.50 D", "+7.25 D"], "a": 3, "why": ["근시처럼 약해지는 방향으로 계산했어요.", "방향을 반대로 계산했어요.", "정점간거리를 빼먹었어요.", "Fc = 6 ÷ (1 − 0.014 × 6) = 6 ÷ 0.916 ≈ +6.55 → +6.50 D. 원시는 CL이 강해져요.", "너무 크게 잡았어요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "nsopt-06", "ch": "sopt", "part": "p5", "tier": "심화", "tag": "[출제기준 추정]", "mt": "vertex", "q": "+12.00 D, 정점간거리 10 mm를 간편식(F + dF²)으로 계산했을 때 정식 계산과의 차이에 가장 가까운 것은?", "o": ["약 0.20 D", "0 D", "약 2.00 D", "약 0.05 D", "약 1.44 D"], "a": 0, "why": ["정식 12 ÷ 0.88 ≈ 13.64 D, 간편 12 + 0.01 × 144 = 13.44 D → 차이 약 0.20 D. 고도수일수록 간편식 오차가 커져요.", "간편식도 근사라 오차가 있어요.", "계산 실수예요.", "오차를 너무 작게 봤어요.", "dF² 값 자체를 오차로 착각했어요."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "nrefr-01", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "sign", "q": "S −3.00 D C −1.50 D Ax 90의 구면등가는?", "o": ["−4.50 D", "−2.25 D", "−1.50 D", "−3.00 D", "−3.75 D"], "a": 4, "why": ["C를 반으로 나누지 않았어요.", "C/2의 부호를 반대로 더했어요.", "원주만 봤어요.", "원주를 무시했어요.", "S + C/2 = −3 + (−0.75) = −3.75 D."], "e": "", "th": "", "cite": "", "area": "응용"}, {"id": "nrefr-02", "ch": "refr", "part": "p5", "tier": "응용", "tag": "[출제기준 추정]", "mt": "sign", "q": "S +1.00 D C −2.00 D Ax 30을 (+)원주 형식으로 바꾸면?", "o": ["S −1.00 D C −2.00 D Ax 120", "S +1.00 D C +2.00 D Ax 120", "S −1.00 D C +2.00 D Ax 30", "S −1.00 D C +2.00 D Ax 120", "S +3.00 D C −2.00 D Ax 120"], "a": 3, "why": ["C의 부호를 바꾸지 않았어요.", "S를 바꾸지 않았어요.", "축을 90° 돌리지 않았어요.", "S′ = S + C = −1.00, C′ = +2.00, 축 30 + 90 = 120.", "S − C로 계산했어요."], "e": "", "th": "", "cite": "", "area": "응용"}, {"id": "nsopt-07", "ch": "sopt", "part": "p5", "tier": "기본", "tag": "[출제기준 추정]", "mt": "concept", "q": "오른눈에 3Δ BI와 4Δ BU가 함께 필요하다. 하나의 프리즘으로 합치면 크기는?", "o": ["3.5Δ", "12Δ", "7Δ", "1Δ", "5Δ"], "a": 4, "why": ["평균을 냈어요.", "곱했어요.", "단순히 더했어요.", "단순히 뺐어요.", "수평·수직은 직각이므로 √(3² + 4²) = 5Δ."], "e": "", "th": "", "cite": "", "area": "이론"}, {"id": "nfab-04", "ch": "fab", "part": "p5", "tier": "응용", "tag": "[기출 확인]", "mt": "base", "q": "처방 O.S. S −3.00 D C −1.00 D Ax 180, 1.5Δ B.I., 측정 단안 P.D. 31 mm일 때 조제가공 단안 P.D.는?", "o": ["26 mm", "31 mm", "34 mm", "35.5 mm", "36 mm"], "a": 4, "why": ["이동 방향을 반대로 했어요.", "프리즘을 무시했어요.", "S + C = −4.00 D를 써서 c = 3.75 mm로 계산했어요(수평 경선 도수 실수).", "1.5 × 3 = 4.5 mm로 곱했어요.", "축이 180°이므로 수평(180°) 경선 도수 = S = −3.00 D. c = 1.5 ÷ 3 = 0.5 cm = 5 mm. 오목렌즈 BI → 중심을 귀 쪽으로 → 31 + 5 = 36 mm. (국시원 예시문항 3번과 같은 유형)"], "e": "", "th": "", "cite": "", "area": "응용"}, {"id": "nrefr-03", "ch": "refr", "part": "p5", "tier": "기본", "tag": "[기출 확인]", "mt": "concept", "q": "운무 상태에서 방사선시표를 보게 했더니 2시–8시 방향 선 var BANK = D.qs || [];

function qCard(q, n, opt){
  opt = opt || {};

  var tagc = q.tag.indexOf('기출') >= 0 ? 'ok' : 'est';
  el.innerHTML = '<div class="qh"><span class="num">' + (n ? n + '.' : '') + '</span><span class="tier t-' + q.tier + '">' + q.tier + '</span><span class="tag ' + tagc + '">' + q.tag + '</span>' +
    (q.ch && D.chtitle ? '<span class="mtl">' + (D.chtitle[q.ch] || '') + '</span>' : '') + '</div><div class="qt">' + q.q + '</div>' +
    q.o.map(function(o, i){ return '<button class="opt" type="button" data-i="' + i + '"><b>' + CIRC[i] + '</b> ' + o + '</button>'; }).join('') +
    '<div class="diag" hidden></div>';
  $$('.opt', el).forEach(function(b){ b.addEventListener('click', function(){ choose(el, q, +b.getAttribute('data-i'), opt); }); });

}

function similar(el, q){

// ---------- 플래시카드 (라이트너) ----------
var INTERVAL = [0, 1, 3, 7, 14];
function mountCards(root){
  var cards = D.cards || [], DAY = 86400000;
  root.innerHTML = '<div class="card"><div class="boxes" id="fc-boxes"></div><div class="ctrl"><select id="fc-part"><option value="">모든 파트</option>' + (D.partsSel || []).map(function(p){ return '<option value="' + p.key + '">' + p.title + '</option>'; }).join('') + '</select></div></div><div class="flash" id="fc"></div><div class="ctrl"><button class="btn l" id="fc-show" type="button">뒤집기</button><button class="btn g" id="fc-ok" type="button">알았어요</button><button class="btn o" id="fc-no" type="button">몰랐어요</button></div>';
  var cur = null, part = '';
  function st(c){ return S.cards[c.id] || {b:0, due:0}; }
  function counts(){ var n = [0, 0, 0, 0, 0]; cards.forEach(function(c){ n[st(c).b]++; }); $('#fc-boxes', root).innerHTML = n.map(function(x, i){ return '<span>' + (i < 4 ? '상자' + (i + 1) : '완료') + ' ' + x + '</span>'; }).join(''); }
  function next(){
    var now = Date.now(); var pool = cards.filter(function(c){ return (!part || c.part === part) && st(c).due <= now; });
    counts();
    if (!pool.length){ $('#fc', root).innerHTML = '<p>오늘 볼 카드를 다 봤어요. 내일 다시 와요!</p>'; cur = null; return; }
    pool.sort(function(a, b){ return st(a).b - st(b).b; }); var low = st(pool[0]).b; pool = shuffle(pool.filter(function(c){ return st(c).b === low; }));
    cur = pool[0]; $('#fc', root).innerHTML = '<div class="meta">' + (cur.ptitle || '') + ' · ' + (st(cur).b < 4 ? '상자' + (st(cur).b + 1) : '완료') + '</div><div class="front">' + cur.f + '</div><div class="back" hidden>' + cur.b + '</div>';
  }
  function mark(ok){ if (!cur) return; var s = st(cur); s.b = ok ? Math.min(4, s.b + 1) : 0; s.due = Date.now() + INTERVAL[s.b] * DAY; S.cards[cur.id] = s; save(); next(); }
  $('#fc-show', root).onclick = function(){ var b = $('#fc .back', root); if (b) b.hidden = !b.hidden; };
  $('#fc-ok', root).onclick = function(){ mark(true); }; $('#fc-no', root).onclick = function(){ mark(false); };
  $('#fc-part', root).onchange = function(){ part = this.value; next(); };
  next();
}

// ---------- 질문 바 (AI로 연결) ----------
function askUrl(svc, text){
  var cat = (document.body.getAttribute('data-cat') || '기타');
  var prompt = '저는 한국 안경사 국가시험을 준비하는 학생입니다. [' + cat + '] 쉬운 말로, 근거(이론·공식·법조문)와 함께 설명해 주세요: ' + text;
  return (svc === 'gpt' ? 'https://chatgpt.com/?q=' : 'https://grok.com/?q=') + encodeURIComponent(prompt);
}
function mountAsk(){
  var f = $('#askform'); if (!f) return;
  function go(svc){ var t = $('#askq').value.trim(); if (!t){ $('#askq').focus(); return; } window.open(askUrl(svc, t), '_blank', 'noopener'); }
  f.addEventListener('submit', function(e){ e.preventDefault(); go('grok'); });
  var alt = $('#askalt'); if (alt) alt.addEventListener('click', function(){ go('gpt'); });
  $$('.bigbtns button').forEach(function(b){ b.addEventListener('click', function(){ document.body.setAttribute('data-cat', b.textContent); $$('.bigbtns button').forEach(function(x){ x.classList.toggle('on', x === b); }); var q = $('#askq'); q.placeholder = '[' + b.textContent + '] 궁금한 걸 적어 주세요'; q.focus(); }); });
}

// ---------- 홈: D-day, 오늘, 진행 ----------
function mountHome(){
  var ex = new Date(D.examDate + 'T09:00:00+09:00'), now = new Date();
  var dd = Math.ceil((ex - now) / 86400000), e = $('#dday'); if (e) e.textContent = dd > 0 ? 'D-' + dd : (dd === 0 ? 'D-DAY' : '시험 종료');
  var start = new Date('2026-11-10T00:00:00+09:00'), k = Math.floor((now - start) / 86400000);
  var t = $('#today');
  if (t){
    if (k < 0) t.innerHTML = '11월 10일에 D1부터 시작해요.';
    else if (k < 21){ var d = (k % 10) + 1; t.innerHTML = '오늘은 <b>' + (k < 10 ? '1회차' : (k < 20 ? '2회차' : '마무리')) + ' D' + d + '</b> → <a data-l="d' + (d < 10 ? '0' + d : d) + '.html">오늘 할 일 열기</a>'; }
    else if (dd > 0) t.innerHTML = '지금은 <b>복습 기간</b>이에요 → <a data-l="quiz.html#mode=weak">약한 부분 훈련</a> · <a data-l="quiz.html#mode=mock">모의고사</a>';
    else t.innerHTML = '시험이 끝났어요. 수고했어요!';
  }
  $$('[data-day]').forEach(function(a){ if (S.days[a.getAttribute('data-day')]) a.classList.add('done'); });
  var n = 0, r = 0; Object.keys(S.q).forEach(function(k){ n++; if (S.q[k].last) r++; });
  var st = $('#stats'); if (st){ var w = weakList().slice(0, 3); st.innerHTML = '푼 문제 ' + n + '개 · 최근 정답 ' + r + '개' + (n ? ' (' + Math.round(r / n * 100) + '%)' : '') + (w.length ? '<br>약한 실수 종류: ' + w.map(function(x){ return mtName(x.k) + ' ' + Math.round(x.rate * 100) + '%'; }).join(', ') : ''); }
  fixLinks(t);
}
function mountDayDone(){
  var c = $('#daydone'); if (!c) return; var k = c.getAttribute('data-d');
  c.checked = !!S.days[k]; c.addEventListener('change', function(){ S.days[k] = c.checked ? Date.now() : 0; save(); });
}
// ---------- 해시 → 섹션 이동 ----------
function scrollHash(){
  var h = decodeURIComponent(location.hash.slice(1)); if (!h || h.indexOf('=') >= 0) return;
  var el = document.getElementById(h); if (el) setTimeout(function(){ el.scrollIntoView(); }, 60);
}
// ---------- QA 훅 (#qa 일 때만) ----------
function qa(){
  if (location.hash.indexOf('qa') < 0) return;
  var W = document.documentElement.clientWidth, over = [];
  $$('body *').forEach(function(el){ var r = el.getBoundingClientRect(); if (r.width > 0 && (r.right > W + 1 || r.left < -1) && !el.closest('.tblw') && !el.closest('nav.tabs') && getComputedStyle(el).position !== 'fixed') over.push(el.tagName + '.' + el.className); });
  var b = $('.q .opt'), clicked = 'none';
  if (b){ b.click(); var d = b.closest('.q').querySelector('.diag'); clicked = d && !d.hidden ? 'ok' : 'fail'; var s = d && d.querySelector('.sim'); if (s){ s.click(); clicked += (d.querySelector('.simbox .q') ? '+sim' : '+nosim'); } }
  document.body.setAttribute('data-qa', JSON.stringify({w:W, sw:document.documentElement.scrollWidth, over:over.slice(0, 10), click:clicked, qn:$$('.q').length}));
}
document.addEventListener('DOMContentLoaded', function(){
  fixLinks();
  var on = $('nav.tabs a.on'); if (on) on.parentNode.scrollLeft = Math.max(0, on.offsetLeft - 60);
  $$('[data-set]').forEach(mountSet);
  var qz = $('#quizapp'); if (qz) mountQuiz(qz);
  var fc = $('#cardapp'); if (fc) mountCards(fc);
  mountAsk(); mountDayDone();
  if (D.page === 'home' || D.offline) mountHome();
  scrollHash(); window.addEventListener('hashchange', scrollHash);
  setTimeout(qa, 300);
});
})();
</script></body></html>
